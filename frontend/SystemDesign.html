================================================================ */
function buildTree(){
  tree.innerHTML='';
  MODULES.forEach(m=>{
    const mod=document.createElement('div');mod.className='mod';mod.dataset.num=m.num;
    const doneCt=m.lessons.filter(l=>done.has(l.id)).length;
    const head=document.createElement('button');head.className='mod-head';head.setAttribute('aria-expanded','false');
    head.innerHTML=`<span class="chev">${icon('chev',11)}</span>${folderIcon(m.color)}<span>${m.num}. ${m.title}</span><span class="mcount">${doneCt}/${m.lessons.length}</span>`;
    const list=document.createElement('div');list.className='lessons';
    m.lessons.forEach(l=>{
      const b=document.createElement('button');b.className='lesson-btn';b.dataset.id=l.id;
      b.innerHTML=`<span class="lic">${icon('doc',13)}</span><span class="lt">${l.title}</span>`;
      b.addEventListener('click',()=>{loadLesson(l.id);closeSidebar();});
      list.appendChild(b);
    });
    head.addEventListener('click',()=>{mod.classList.toggle('open');head.setAttribute('aria-expanded',mod.classList.contains('open'));});
    mod.append(head,list);tree.appendChild(mod);
  });
  refreshTree();
}
function refreshTree(){
  document.querySelectorAll('.mod').forEach(mod=>{
    const m=MODULES.find(x=>x.num===mod.dataset.num);
    const doneCt=m.lessons.filter(l=>done.has(l.id)).length;
    mod.querySelector('.mcount').textContent=`${doneCt}/${m.lessons.length}`;
    if(m.lessons.some(l=>l.id===cur.id))mod.classList.add('open');
    mod.querySelectorAll('.lesson-btn').forEach(b=>{
      const id=b.dataset.id;
      b.classList.toggle('active',id===cur.id);
      b.classList.toggle('done',done.has(id));
      b.querySelector('.lic').innerHTML=done.has(id)?icon('checkc',13):(id===cur.id?icon('checkc',13):icon('doc',13));
    });
  });
  const ct=`${done.size} / ${ALL.length}`;
  progCount.textContent=ct;tbCount.textContent=ct;
}

/* progress popover */
function renderProgPop(){
  const pct=Math.round(done.size/ALL.length*100);
  progPop.innerHTML=`<h4>COURSE PROGRESS</h4><div class="big">${pct}% <span>· ${done.size} of ${ALL.length} lessons</span></div>`+
   MODULES.map(m=>{const d=m.lessons.filter(l=>done.has(l.id)).length;
     return `<div class="pp-row"><span class="nm">${m.num}. ${m.title}</span><span class="pp-bar"><i style="width:${d/m.lessons.length*100}%"></i></span><span class="ct">${d}/${m.lessons.length}</span></div>`}).join('')+
   `<button class="pp-reset" id="resetBtn">Reset all progress</button>`;
  $('resetBtn').addEventListener('click',()=>{
    if(confirm('Reset all course progress?')){done.clear();for(const k in learn)delete learn[k];store.save();refreshTree();renderProgPop();renderLearn();toast('Progress reset');}
  });
}
progBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const on=progPop.classList.toggle('on');
  progBtn.setAttribute('aria-expanded',on);
  if(on)renderProgPop();
});
document.addEventListener('click',e=>{
  if(!progPop.contains(e.target)&&e.target!==progBtn){progPop.classList.remove('on');progBtn.setAttribute('aria-expanded','false');}
});

function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('on');}
menuBtn.addEventListener('click',()=>{sidebar.classList.add('open');scrim.classList.add('on');});
scrim.addEventListener('click',closeSidebar);

/* ================================================================
   SCENE BUILD
================================================================ */
function anchor(nd){return nd.type==='pill'?{x:nd.x,y:nd.y}:{x:nd.x,y:nd.y-22};}
function edgeKey(a,b){return [a,b].sort().join('|');}
function buildScene(){
  const sc=SCENES[cur.scene];
  sceneNodes={};edgeEls={};
  const pairs=new Set(sc.edges.map(e=>edgeKey(e[0],e[1])));
  cur.steps.forEach(s=>(s.flights||[]).forEach(f=>pairs.add(edgeKey(f.a,f.b))));
  const nodesById=Object.fromEntries(sc.nodes.map(nd=>[nd.id,nd]));
  let defs=`<defs><linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9b8f5"/><stop offset="1" stop-color="#8f7ae8"/></linearGradient></defs>`;
  let edgeSvg='',nodeSvg='';
  let i=0;
  pairs.forEach(k=>{
    const [a,b]=k.split('|');const na=nodesById[a],nb=nodesById[b];if(!na||!nb)return;
    const p1=anchor(na),p2=anchor(nb);
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1;
    const bow=(i++%2?1:-1)*Math.min(26,len*.12);
    const cx=mx-dy/len*bow,cy=my+dx/len*bow;
    edgeSvg+=`<path class="edge" data-edge="${k}" d="M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}"/>`;
  });
  sc.nodes.forEach(nd=>{
    const art=nd.type==='pill'?pillArt(nd.label,nd.icn):`<g class="art"><g class="bumpable">${(ART[nd.type]||ART.service)()}</g></g>${nd.label?labelPill(nd.label):''}`;
    nodeSvg+=`<g class="node" data-node="${nd.id}" transform="translate(${nd.x},${nd.y})">
      <ellipse class="ring" cx="0" cy="${nd.type==='pill'?0:16}" rx="${nd.type==='laptop'?120:48}" ry="${nd.type==='laptop'?30:15}"/>
      <g class="float">${art}</g></g>`;
  });
  scene.innerHTML=defs+`<g id="edges">${edgeSvg}</g><g id="nodes">${nodeSvg}</g><g id="pkts"></g>`;
  pktLayer=scene.querySelector('#pkts');
  scene.querySelectorAll('.node').forEach(el=>sceneNodes[el.dataset.node]=el);
  scene.querySelectorAll('.edge').forEach(el=>edgeEls[el.dataset.edge]=el);
}

/* ================================================================
   STEP ENGINE
================================================================ */
function computeVisible(upto){
  const set=new Set();
  for(let i=0;i<=upto;i++){
    const s=cur.steps[i];
    (s.add||[]).forEach(id=>set.add(id));
    (s.remove||[]).forEach(id=>set.delete(id));
  }
  return set;
}
function fmt(v,unit){
  if(v==null)return '—';
  const r=Math.abs(v)>=100?Math.round(v):(Math.round(v*10)/10);
  return `${r}<small>${unit}</small>`;
}
function renderMetrics(){
  metricsEl.innerHTML=cur.metrics.map(m=>`<div class="metric" data-m="${m.id}">
    <div class="ml">${icon(m.icn,10)} ${m.label}</div><div class="mv" id="mv-${m.id}">—</div></div>`).join('');
}
function applyStep(){
  const s=cur.steps[step];
  visible=computeVisible(step);
  Object.entries(sceneNodes).forEach(([id,el])=>{
    el.classList.toggle('on',visible.has(id));
    el.classList.toggle('focus',(s.focus||[]).includes(id));
    el.classList.toggle('alert',(s.alert||[]).includes(id));
    el.classList.remove('bump');
  });
  Object.entries(edgeEls).forEach(([k,el])=>{
    const [a,b]=k.split('|');el.classList.toggle('on',visible.has(a)&&visible.has(b));
  });
  /* note */
  if(s.note){noteEl.textContent=s.note;noteEl.classList.remove('hidden');}
  else noteEl.classList.add('hidden');
  /* metrics targets */
  const targets=s.metrics||{};
  cur.metrics.forEach(m=>{
    if(targets[m.id]!==undefined){
      const from=metricVals[m.id]??0;
      metricTweens[m.id]={from,to:targets[m.id],t0:animT+150,dur:750,unit:m.unit};
      metricVals[m.id]=targets[m.id];
      document.querySelector(`.metric[data-m="${m.id}"]`)?.classList.add('hot');
    }
  });
  /* flights */
  pktLayer.innerHTML='';
  flights=(s.flights||[]).map(f=>{
    const path=edgeEls[edgeKey(f.a,f.b)];
    if(!path)return null;
    const rev=edgeKey(f.a,f.b).split('|')[0]!==f.a;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const colors={req:'#e07b39',res:'#4f9d5d',hs:'#fffdf4'};
    g.innerHTML=`<circle r="6.5" fill="${colors[f.kind]||colors.req}" stroke="#26251f" stroke-width="1.6" ${f.kind==='hs'?'stroke-dasharray="3 2.5"':''}/>${f.label?`<text class="pkt-label" y="-12" text-anchor="middle">${f.label}</text>`:''}`;
    g.style.opacity='0';pktLayer.appendChild(g);
    return {...f,path,rev,len:path.getTotalLength(),el:g,arrived:false};
  }).filter(Boolean);
  cycleLen=flights.length?Math.max(...flights.map(f=>f.delay+f.dur))+700:0;
  animT=0;playing=true;syncPauseBtn();
  /* right panel */
  stepCount.textContent=`STEP ${step+1} / ${cur.steps.length}`;
  kindEl.textContent=s.kind;kindEl.className='kind '+s.kind;
  stepTitle.textContent=s.title;
  stepBody.innerHTML=s.body.map(p=>`<p>${p}</p>`).join('');
  kiText.textContent=s.key;
  const ki=$('keyidea');ki.style.animation='none';void ki.offsetWidth;ki.style.animation='';
  /* nav */
  backBtn.disabled=step===0;
  backBtn.innerHTML=icon('left',13)+' Back';
  updateNextBtn();
  /* timeline */
  tlCount.textContent=`Step ${step+1} of ${cur.steps.length}`;
  tl.querySelectorAll('.tstep').forEach((el,i)=>{
    el.classList.toggle('cur',i===step);el.classList.toggle('past',i<step);
  });
  tl.querySelector('.tl-progress').style.width=(step/(cur.steps.length-1)*100)+'%';
}
function updateNextBtn(){
  const last=step===cur.steps.length-1;
  nextBtn.classList.toggle('finish',last&&!done.has(cur.id));
  if(last&&finishedView){
    const idx=ALL.findIndex(l=>l.id===cur.id);
    const nxt=ALL[idx+1];
    nextBtn.innerHTML=nxt?`Next lesson: ${nxt.title} `+icon('right',13):'Course complete 🎉';
    nextBtn.disabled=!nxt;
  }else if(last){
    nextBtn.innerHTML='Finish lesson '+icon('check',13);
    nextBtn.disabled=false;
  }else{
    nextBtn.innerHTML=`Next: ${cur.steps[step+1].name} `+icon('right',13);
    nextBtn.disabled=false;
  }
}
function go(i){
  step=Math.max(0,Math.min(cur.steps.length-1,i));
  finishedView=false;
  applyStep();
}
function next(){
  if(step<cur.steps.length-1){go(step+1);return;}
  if(!finishedView){completeLesson();return;}
  const idx=ALL.findIndex(l=>l.id===cur.id);
  if(ALL[idx+1])loadLesson(ALL[idx+1].id);
}
function completeLesson(){
  finishedView=true;
  const first=!done.has(cur.id);
  done.add(cur.id);
  learn[cur.id]=cur.learn.map(()=>true);
  store.save();refreshTree();renderLearn();updateNextBtn();
  if(first){confetti();toast('Lesson complete — nice work! ✓');}
  else toast('Lesson already completed ✓');
}
backBtn.addEventListener('click',()=>go(step-1));
nextBtn.addEventListener('click',next);

/* ================================================================
   ANIMATION LOOP
================================================================ */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(now){
  const dt=Math.min(50,now-lastFrame);lastFrame=now;
  if(playing)animT+=dt;
  const loop=cur.steps[step].loop&&cycleLen>0;
  const t=loop?(animT%cycleLen):animT;
  if(loop&&animT>0&&t<dt)flights.forEach(f=>{f.arrived=false;f.el.style.opacity='0';});
  flights.forEach(f=>{
    const p=(t-f.delay)/f.dur;
    if(p<0){f.el.style.opacity='0';return;}
    if(p>=1){
      if(!f.arrived){
        f.arrived=true;
        const target=sceneNodes[f.b];
        if(target){target.classList.remove('bump');void target.getBoundingClientRect();target.classList.add('bump');}
      }
      const fade=Math.max(0,1-(t-f.delay-f.dur)/260);
      f.el.style.opacity=fade;
      if(fade<=0)return;
      const pt=f.path.getPointAtLength(f.len);
      f.el.setAttribute('transform',`translate(${pt.x},${pt.y})`);
      return;
    }
    f.el.style.opacity=Math.min(1,p*6);
    const d=(f.rev?1-ease(p):ease(p))*f.len;
    const pt=f.path.getPointAtLength(d);
    f.el.setAttribute('transform',`translate(${pt.x},${pt.y})`);
  });
  /* metric tweens */
  Object.entries(metricTweens).forEach(([id,tw])=>{
    const p=Math.max(0,Math.min(1,(animT-tw.t0)/tw.dur));
    const v=tw.from+(tw.to-tw.from)*ease(p);
    const el=$('mv-'+id);if(el)el.innerHTML=fmt(v,tw.unit);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function syncPauseBtn(){
  pauseBtn.innerHTML=(playing?icon('pause',13)+' Pause':icon('play',13)+' Play');
  pauseBtn.setAttribute('aria-pressed',String(!playing));
}
pauseBtn.addEventListener('click',()=>{playing=!playing;syncPauseBtn();});
replayBtn.addEventListener('click',()=>{
  flights.forEach(f=>{f.arrived=false;f.el.style.opacity='0';});
  Object.entries(metricTweens).forEach(([id,tw])=>{tw.t0=150;tw.from=0;});
  animT=0;playing=true;syncPauseBtn();
});

/* ================================================================
   TIMELINE / LEARN / HEADER
================================================================ */
function buildTimeline(){
  tl.innerHTML=`<div class="tl-progress" style="width:0%"></div>`+cur.steps.map((s,i)=>
    `<button class="tstep" data-i="${i}" aria-label="Go to step ${i+1}: ${s.name}"><span class="tc">${i+1}</span><span class="tlab">${s.name}</span></button>`).join('');
  tl.querySelectorAll('.tstep').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
}
function renderLearn(){
  const checks=learn[cur.id]||cur.learn.map(()=>false);
  learnEl.innerHTML=cur.learn.map((t,i)=>
    `<li><label class="learn-item"><input type="checkbox" data-i="${i}" ${checks[i]?'checked':''}><span class="cb">${icon('check',10)}</span><span class="lx">${t}</span></label></li>`).join('');
  learnEl.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{
    const arr=learn[cur.id]||cur.learn.map(()=>false);
    arr[+inp.dataset.i]=inp.checked;learn[cur.id]=arr;store.save();
  }));
}
function renderHeader(){
  const m=cur.module;
  const li=m.lessons.findIndex(l=>l.id===cur.id);
  crumb.innerHTML=`<b>${m.num}. ${m.title}</b> &nbsp;/&nbsp; Lesson ${li+1} of ${m.lessons.length}`;
  lessonTitle.textContent=cur.title;
  lessonSub.textContent=cur.sub;
  const lvlCls=cur.level==='Intermediate'?'int':cur.level==='Advanced'?'adv':'';
  badges.innerHTML=`<span class="badge time">${icon('clock',11)} ${cur.min} min</span>
    <span class="badge level ${lvlCls}">${icon('bars',11)} ${cur.level}</span>
    <span class="badge steps">${icon('list',11)} ${cur.steps.length} steps</span>`;
}

/* ================================================================
   LOAD LESSON
================================================================ */
function loadLesson(id){
  cur=byId[id];step=0;finishedView=false;
  metricVals={};metricTweens={};
  renderHeader();renderMetrics();buildScene();buildTimeline();renderLearn();
  applyStep();refreshTree();store.save();
  document.querySelector('.main').scrollTo({top:0});
  if(window.innerWidth<=1120)window.scrollTo({top:0,behavior:'smooth'});
}

/* ================================================================
   KEYBOARD
================================================================ */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;
  if(e.key==='ArrowRight'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(step>0)go(step-1);}
  else if(e.key==='r'||e.key==='R'){replayBtn.click();}
  else if(e.key===' '&&tag!=='button'){e.preventDefault();pauseBtn.click();}
  else if(e.key==='Escape'){closeSidebar();progPop.classList.remove('on');}
});

/* ================================================================
   TOAST + CONFETTI
================================================================ */
let toastTimer=null;
function toast(msg){
  toastEl.innerHTML=icon('checkc',14)+' '+msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),2600);
}
function confetti(){
  const colors=['#a5d877','#f2c94c','#e07b39','#8f7ae8','#7fb3e8','#eb9a86'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.background=colors[i%colors.length];
    stage.appendChild(c);
    const ang=Math.random()*Math.PI*2,dist=90+Math.random()*180;
    c.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+120}px) rotate(${Math.random()*720-360}deg)`,opacity:0}
    ],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>c.remove();
  }
}

/* ================================================================
   INIT
================================================================ */
buildTree();
loadLesson(cur.id);
</script>
