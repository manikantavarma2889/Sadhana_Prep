<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designed to Scale — Learn System Design Visually</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3edda; --panel:#fbf7ea; --panel2:#fffdf4; --canvas:#f8f3e3;
  --ink:#26251f; --muted:#8b8677; --faint:#b6b09d;
  --line:#e4dcc4; --line2:#d5cdb2;
  --green:#a5d877; --green-deep:#4c8b3f; --green-soft:#d9edc4; --green-hi:#c9e8a0;
  --yellow:#f6ecc4; --yellow-line:#e3d59c; --yellow-ink:#8a6d1b;
  --purple:#e6e1f8; --purple-line:#cbc2ec; --purple-ink:#5b48b8;
  --blue:#dcebfa; --blue-line:#bcd7f0; --blue-ink:#2b6cb0;
  --red:#f6d9d2; --red-line:#eab9ac; --red-ink:#b0432c;
  --orange:#e07b39; --resp:#4f9d5d; --hs:#9a958a;
  --shadow:0 2px 0 var(--ink);
  --r:14px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--mono); background:var(--bg); color:var(--ink);
  font-size:13px; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:var(--mono);color:var(--ink);cursor:pointer;background:none;border:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--purple-ink);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:250px minmax(0,1fr) 316px;height:100dvh}

/* ---------- topbar (mobile) ---------- */
.topbar{display:none;position:sticky;top:0;z-index:40;align-items:center;gap:10px;
  padding:10px 14px;background:var(--panel);border-bottom:1.5px solid var(--line2)}
.topbar .tb-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.topbar .tb-count{margin-left:auto;font-size:11px;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1.5px solid var(--ink);border-radius:9px;background:var(--panel2);box-shadow:var(--shadow)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(38,37,31,.35);z-index:45;backdrop-filter:blur(2px)}
.scrim.on{display:block}

/* ---------- sidebar ---------- */
.sidebar{background:var(--panel);border-right:1.5px solid var(--line2);display:flex;flex-direction:column;
  height:100dvh;position:relative;z-index:50}
.side-head{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;font-weight:800;font-size:14px}
.side-head .count{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--muted)}
.tree{flex:1;overflow-y:auto;padding:2px 10px 12px}
.mod{margin-bottom:2px}
.mod-head{display:flex;align-items:center;gap:7px;width:100%;padding:7px 6px;border-radius:9px;
  font-size:12px;font-weight:700;text-align:left;transition:background .15s}
.mod-head:hover{background:#f1ead6}
.mod-head .chev{transition:transform .22s;color:var(--muted);flex:none}
.mod.open .mod-head .chev{transform:rotate(90deg)}
.mod-head .mcount{margin-left:auto;font-size:10px;font-weight:500;color:var(--muted)}
.mod-head svg.folder{flex:none}
.lessons{overflow:hidden;max-height:0;transition:max-height .3s ease}
.mod.open .lessons{max-height:600px}
.lesson-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px 6px 26px;margin:1px 0;border-radius:9px;font-size:11.5px;font-weight:500;
  color:#57534a;border:1.5px solid transparent;position:relative;transition:background .15s}
.lesson-btn::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1.5px;background:var(--line2)}
.lesson-btn:hover{background:#f1ead6}
.lesson-btn.active{background:var(--green-hi);border-color:var(--ink);color:var(--ink);font-weight:700;box-shadow:0 1.5px 0 var(--ink)}
.lesson-btn .lic{flex:none;color:var(--faint)}
.lesson-btn.done .lic{color:var(--green-deep)}
.lesson-btn.active .lic{color:var(--green-deep)}
.lesson-btn .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1.5px solid var(--line2);padding:10px 12px;position:relative}
.prog-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:1.5px solid var(--ink);
  border-radius:10px;background:var(--panel2);box-shadow:var(--shadow);font-size:11px;font-weight:700;letter-spacing:.4px}
.prog-btn:active{transform:translateY(2px);box-shadow:none}
.prog-btn b{margin-left:auto;font-weight:800}
.prog-btn .pc{color:var(--muted);transition:transform .2s}
.prog-btn[aria-expanded="true"] .pc{transform:rotate(90deg)}
.prog-pop{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:var(--panel2);
  border:1.5px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:14px;z-index:60;
  opacity:0;pointer-events:none;transform:translateY(6px);transition:.2s}
.prog-pop.on{opacity:1;pointer-events:auto;transform:none}
.prog-pop h4{font-size:11px;letter-spacing:.6px;margin-bottom:4px}
.prog-pop .big{font-size:22px;font-weight:800;margin-bottom:10px}
.prog-pop .big span{font-size:12px;color:var(--muted);font-weight:500}
.pp-row{display:flex;align-items:center;gap:8px;font-size:10.5px;margin:6px 0}
.pp-row .nm{width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#57534a}
.pp-bar{flex:1;height:7px;border:1px solid var(--line2);border-radius:6px;background:#f1ead6;overflow:hidden}
.pp-bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s}
.pp-row .ct{width:34px;text-align:right;color:var(--muted)}
.pp-reset{margin-top:10px;width:100%;padding:7px;border:1.5px solid var(--red-line);color:var(--red-ink);
  background:var(--red);border-radius:8px;font-size:10.5px;font-weight:700}
.pp-reset:hover{filter:brightness(.97)}

/* ---------- main ---------- */
.main{overflow-y:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crumb{font-size:11px;color:var(--muted);margin-bottom:8px}
.crumb b{color:var(--ink);font-weight:600}
.title-row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1.5px solid var(--ink);font-size:10.5px;font-weight:700;box-shadow:0 1.5px 0 var(--ink)}
.badge.time{background:var(--yellow)} .badge.level{background:var(--green-soft)}
.badge.level.int{background:var(--yellow)} .badge.level.adv{background:var(--red)}
.badge.steps{background:var(--purple)}
.sub{color:#6b675c;font-size:12px;margin-top:7px}

.canvas-panel{background:var(--canvas);border:1.5px solid var(--line2);border-radius:var(--r);
  display:flex;flex-direction:column;flex:1;min-height:480px;position:relative;overflow:hidden;
  background-image:
    repeating-linear-gradient(60deg,transparent 0 21px,rgba(190,178,140,.16) 21px 22px),
    repeating-linear-gradient(-60deg,transparent 0 21px,rgba(190,178,140,.16) 21px 22px)}
.canvas-top{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 0;flex-wrap:wrap;z-index:3}
.metrics{display:flex;gap:8px;flex-wrap:wrap}
.metric{background:var(--panel2);border:1.5px solid var(--line2);border-radius:10px;padding:7px 12px 8px;min-width:96px;
  box-shadow:0 1.5px 0 rgba(38,37,31,.12);transition:border-color .3s}
.metric.hot{border-color:var(--ink)}
.metric .ml{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:700;letter-spacing:.7px;color:var(--muted)}
.metric .mv{font-size:15px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.metric .mv small{font-size:9.5px;font-weight:600;color:var(--muted);margin-left:2px}
.canvas-actions{margin-left:auto;display:flex;gap:8px}
.cbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:10px;
  background:var(--panel2);font-size:11.5px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s,background .15s}
.cbtn:hover{background:#fff}
.cbtn:active{transform:translateY(2px);box-shadow:none}
.cbtn[aria-pressed="true"]{background:var(--yellow)}
.stage{flex:1;position:relative;min-height:340px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.note{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fdfaf0;
  font-size:11px;font-weight:600;padding:7px 14px;border-radius:999px;z-index:4;white-space:nowrap;
  box-shadow:0 3px 0 rgba(38,37,31,.25);animation:noteIn .35s ease}
@keyframes noteIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.legend{display:flex;gap:16px;padding:10px 16px 12px;font-size:10px;color:var(--muted);z-index:3}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.dot.req{background:var(--orange)} .dot.res{background:var(--resp)} .dot.hs{background:#fffdf4}

/* svg scene */
.edge{fill:none;stroke:#cdc4a6;stroke-width:1.6;stroke-dasharray:5 6;opacity:0;transition:opacity .5s}
.edge.on{opacity:.85}
.node{opacity:0;transition:opacity .45s;pointer-events:none}
.node.on{opacity:1}
.node .float{animation:bob 4.5s ease-in-out infinite}
.node:nth-child(odd) .float{animation-delay:-2.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.node .ring{fill:none;stroke:var(--green-deep);stroke-width:2;stroke-dasharray:4 5;opacity:0;transition:opacity .3s}
.node.focus .ring{opacity:.9;animation:spin 7s linear infinite}
.node.alert .ring{opacity:.95;stroke:var(--red-ink);animation:spin 2.2s linear infinite}
@keyframes spin{to{stroke-dashoffset:-90}}
.node.alert .art{animation:shake .5s ease infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.node .bumpable{transform-origin:center;transform-box:fill-box}
.node.bump .bumpable{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.09)}100%{transform:scale(1)}}
.node text{font-family:var(--mono)}
.pkt-label{font-size:9.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#f8f3e3;stroke-width:3.5px}

/* timeline */
.timeline-panel{background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--r);padding:13px 18px 15px}
.tl-head{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:14px}
.tl-head b{color:var(--ink)}
.tl-wrap{overflow-x:auto;padding-bottom:4px}
.tl{display:flex;justify-content:space-between;position:relative;min-width:660px}
.tl::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:2px;background:var(--line2)}
.tl .tl-progress{position:absolute;left:14px;top:13px;height:2px;background:var(--green-deep);transition:width .4s;max-width:calc(100% - 28px)}
.tstep{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;z-index:1;flex:1;min-width:56px}
.tstep .tc{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);transition:.2s}
.tstep .tlab{font-size:9.5px;color:var(--muted);text-align:center;font-weight:500;transition:.2s}
.tstep:hover .tc{border-color:var(--ink);color:var(--ink)}
.tstep.past .tc{border-color:var(--green-deep);color:var(--green-deep);background:var(--green-soft)}
.tstep.past .tlab{color:#6b675c}
.tstep.cur .tc{background:var(--green);border-color:var(--ink);color:var(--ink);box-shadow:0 1.5px 0 var(--ink);transform:scale(1.12)}
.tstep.cur .tlab{color:var(--ink);font-weight:800}

/* ---------- right ---------- */
.right{overflow-y:auto;padding:16px 16px 20px 0;display:flex;flex-direction:column;gap:14px}
.step-card,.learn-card{background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--r);padding:16px}
.step-card{display:flex;flex-direction:column;flex:1;min-height:420px}
.step-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.step-top .sc{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted)}
.kind{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--ink);box-shadow:0 1.5px 0 var(--ink)}
.kind.PROBLEM{background:var(--red);color:var(--red-ink)}
.kind.CONCEPT{background:var(--blue);color:var(--blue-ink)}
.kind.CASE{background:var(--yellow);color:var(--yellow-ink)}
.kind.RECAP{background:var(--green-soft);color:var(--green-deep)}
.step-card h2{font-size:17px;font-weight:800;line-height:1.3;margin-bottom:12px;letter-spacing:-.2px}
.step-body{font-size:12px;line-height:1.7;color:#45423a}
.step-body p{margin-bottom:11px}
.step-body code{background:#efe8d3;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;font-size:10.5px;font-weight:600;color:var(--ink)}
.keyidea{display:flex;gap:10px;background:var(--purple);border:1.5px solid var(--purple-line);border-radius:11px;
  padding:12px;margin-top:auto;margin-bottom:14px;animation:kiIn .4s ease}
@keyframes kiIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ki-icon{flex:none;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:8px;background:#fffdf4;
  display:flex;align-items:center;justify-content:center;color:var(--purple-ink);box-shadow:0 1.5px 0 var(--ink)}
.ki-label{font-size:8.5px;font-weight:800;letter-spacing:.9px;color:var(--purple-ink);margin-bottom:4px}
.keyidea p{font-size:11px;line-height:1.6;color:#3f3a55}
.step-nav{display:flex;gap:10px}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;
  border:1.5px solid var(--ink);font-size:11.5px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s,filter .15s}
.nav-btn:active{transform:translateY(2px);box-shadow:none}
.nav-btn.back{background:var(--panel2);color:#6b675c}
.nav-btn.back:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-color:var(--line2);color:var(--faint)}
.nav-btn.next{flex:1;background:var(--green);justify-content:space-between}
.nav-btn.next:hover{filter:brightness(1.04)}
.nav-btn.next.finish{background:var(--yellow)}
.kbd-hints{margin-top:12px;font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--panel2);
  padding:1px 5px;font-size:9px;font-family:var(--mono);color:var(--muted)}
.learn-head{font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin-bottom:11px}
.learn-card ul{list-style:none}
.learn-item{display:flex;gap:9px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer;transition:background .15s}
.learn-item:hover{background:#f1ead6}
.learn-item input{position:absolute;opacity:0;pointer-events:none}
.cb{flex:none;width:16px;height:16px;border:1.5px solid var(--line2);border-radius:5px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;color:transparent}
.learn-item input:checked + .cb{background:var(--green);border-color:var(--ink);color:var(--ink)}
.learn-item .lx{font-size:11px;line-height:1.55;color:#57534a;transition:.15s}
.learn-item input:checked ~ .lx{color:var(--faint);text-decoration:line-through}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fdfaf0;
  padding:11px 20px;border-radius:11px;font-size:12px;font-weight:700;z-index:100;opacity:0;pointer-events:none;
  transition:.3s;box-shadow:0 4px 0 rgba(38,37,31,.3);display:flex;gap:9px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:absolute;width:8px;height:12px;top:40%;left:50%;z-index:5;pointer-events:none;border-radius:2px}

.hidden{display:none!important}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  #app{grid-template-columns:236px minmax(0,1fr) 296px}
  h1{font-size:22px}
}
@media (max-width:1120px){
  body{overflow:auto}
  #app{grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto auto;height:auto;
    grid-template-areas:"side main" "side right"}
  .sidebar{grid-area:side;position:sticky;top:0;align-self:start}
  .main{grid-area:main;overflow:visible}
  .right{grid-area:right;overflow:visible;padding:0 18px 24px}
  .step-card{min-height:0}
  .canvas-panel{min-height:440px}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-areas:"main" "right"}
  .topbar{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-105%);transition:transform .28s ease;
    box-shadow:6px 0 24px rgba(38,37,31,.18);height:100dvh}
  .sidebar.open{transform:none}
  .main{padding:14px 12px 8px}
  .right{padding:6px 12px 22px}
  h1{font-size:20px}
  .badges{margin-left:0}
  .canvas-panel{min-height:400px}
  .stage{min-height:280px}
  .metric{min-width:80px;padding:6px 9px}
  .metric .mv{font-size:13px}
  .canvas-actions{margin-left:0;width:100%;justify-content:flex-end}
  .note{font-size:10px;max-width:92%;white-space:normal;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Open course menu"></button>
  <span class="tb-title" id="tbTitle">Course</span>
  <span class="tb-count" id="tbCount">0 / 40</span>
</div>
<div class="scrim" id="scrim"></div>

<div id="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head"><span id="courseIcon"></span> Course <span class="count">40 lessons</span></div>
    <nav class="tree" id="tree" aria-label="Course modules"></nav>
    <div class="side-foot">
      <div class="prog-pop" id="progPop" role="dialog" aria-label="Course progress"></div>
      <button class="prog-btn" id="progBtn" aria-expanded="false">
        PROGRESS <b id="progCount">0 / 40</b> <span class="pc" id="progChev"></span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header>
      <div class="crumb" id="crumb"></div>
      <div class="title-row">
        <h1 id="lessonTitle"></h1>
        <div class="badges" id="badges"></div>
      </div>
      <p class="sub" id="lessonSub"></p>
    </header>

    <section class="canvas-panel" aria-label="Lesson visualization">
      <div class="canvas-top">
        <div class="metrics" id="metrics"></div>
        <div class="canvas-actions">
          <button class="cbtn" id="replayBtn"></button>
          <button class="cbtn" id="pauseBtn" aria-pressed="false"></button>
        </div>
      </div>
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div class="note hidden" id="note"></div>
      </div>
      <div class="legend">
        <span><i class="dot req"></i> request</span>
        <span><i class="dot res"></i> response</span>
        <span><i class="dot hs"></i> handshake</span>
      </div>
    </section>

    <section class="timeline-panel" aria-label="Lesson steps">
      <div class="tl-head"><span>IN THIS LESSON</span><b id="tlCount"></b></div>
      <div class="tl-wrap"><div class="tl" id="tl"></div></div>
    </section>
  </main>

  <!-- ============ RIGHT ============ -->
  <aside class="right">
    <section class="step-card">

{num:'01',title:'Foundations',color:'#7a5c3e',lessons:[
L('request','How a Request Travels',10,'Beginner','Follow one page load hop by hop — and find out where the time really goes.',

 'web',[

 st('Find address','CONCEPT','DNS: the internet’s phone book',
  ['Names are for humans; machines need numbers. Your browser asks a DNS resolver: “what address is <code>shop.example</code>?”','The answer — <code>203.0.113.7</code> — comes back in ~15 ms. Next time it’s cached, so this step costs almost nothing.'],
  'DNS turns names into IP addresses. Caching makes repeat lookups nearly free.',
  {add:['dns'],flights:[fl('laptop','dns','req',200,800,'shop.example?'),fl('dns','laptop','res',1200,800,'203.0.113.7')],metrics:{dns:15},focus:['dns'],note:'DNS ≈ 15 ms cold · ~0 ms cached'}),
 st('Connect','CONCEPT','Say hello before you talk',

  {flights:[fl('laptop','server','hs',200,750,'SYN'),fl('server','laptop','hs',1050,750,'SYN-ACK'),fl('laptop','server','hs',1950,750,'TLS hello'),fl('server','laptop','hs',2800,750,'TLS ok')],metrics:{conn:45},focus:['laptop','server'],note:'2 round trips before any data'}),
 st('Request','CONCEPT','Ask for the page',

 st('Response','CONCEPT','HTML comes home',

 st('More files','CONCEPT','One page, many requests',
  ['The HTML references <code>app.js</code>, <code>style.css</code>, images… each is its own request. Static files come from a CDN edge nearby.','Dynamic calls still go to the origin. A page load is a waterfall of dozens of these conversations.'],

 st('Slow query','CASE','One query eats 400 ms',

 st('Far away','CASE','Physics sends its regards',

 st('Recap','RECAP','Where did the 160 ms go?',

 st('Recap','RECAP','Length vs width',

]),
