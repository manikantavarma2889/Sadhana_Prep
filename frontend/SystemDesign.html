  {flights:[fl('users','lb','req',100,500),fl('lb','s1','req',700,500,'always app 1'),fl('users','lb','req',1400,500),fl('lb','s1','req',2000,500)],loop:true,note:'cookie pins user → app 1'}),
 st('Externalize','CONCEPT','Move state out of the fleet',
  ['Store sessions in a shared Redis. Any app server reads the same session by token. Servers become interchangeable cattle.','Now you can kill, deploy, or autoscale any box mid-session.'],
  'Stateless servers + external state = a truly elastic fleet.',
  {add:['sess'],flights:[fl('lb','s2','req',100,500),fl('s2','sess','req',700,450,'session:abc'),fl('sess','s2','res',1250,450,'user 42 ✓')],metrics:{sticky:0,sess:2,flex:100},focus:['sess'],note:'any server · same session'}),
 st('JWT','CONCEPT','Let the client carry state',
  ['Alternative: sign the session into a token the client sends every time. No server-side lookup at all.','Trade-off: you can’t revoke easily, and tokens grow. Verify signatures; keep them short-lived.'],
  'JWTs move state to the client — cheap reads, hard revocation.',
  {flights:[fl('users','lb','req',100,500,'Bearer eyJ…'),fl('lb','s1','req',700,500,'verify locally ✓')],metrics:{sess:0},loop:true,note:'signed token · no lookup'}),
 st('Recap','RECAP','Cattle, not pets',
  ['Servers should hold nothing they can’t lose. Sessions in Redis or tokens; files in object storage; config in the environment.','That discipline is what makes every later scaling lesson possible.'],
  'If killing any server loses data, you’re not stateless yet.',
  {metrics:{sticky:0,sess:2,flex:100},flights:[fl('users','lb','req',100,500),fl('lb','s1','req',700,450),fl('s1','sess','req',1250,400),fl('sess','s1','res',1750,400)],loop:true})
]),
L('autoscale','Autoscaling',7,'Intermediate','Let the fleet breathe with traffic instead of paying for peak forever.',
 ['Metric-driven scaling loops','Cooldowns and flapping','Predictive vs reactive scaling','Scaling down safely'],
 [M('load','AVG LOAD','gear','%'),M('fleet','FLEET SIZE','server',''),M('cost','COST / HR','chart','$')],'autoscale',[
 st('The waste','PROBLEM','Paying for Black Friday all year',
  ['You provisioned 10 servers for peak. At 3 am, 2 would do. You’re burning 80% of the budget on idle boxes.','Autoscaling matches fleet size to actual load, minute by minute.'],
  'Provision for peak = pay for peak. Elasticity breaks that link.',
  {add:['users','lb','s1','s2','s3','mon'],metrics:{load:12,fleet:3,cost:30},focus:['mon'],note:'3 boxes · 12% load · $30/hr'}),
 st('The loop','CONCEPT','Watch → decide → act',
  ['The autoscaler watches CPU (or queue depth, or RPS). Above 70% for 3 minutes → add a box. Below 30% → remove one.','It’s a control loop. The metrics you choose define what “busy” means.'],
  'Autoscaling is a feedback loop: metric, threshold, action, cooldown.',
  {flights:[fl('lb','mon','res',200,600,'cpu 78%'),fl('mon','s3','req',1000,600,'launch')],metrics:{load:78,fleet:3,cost:30},focus:['mon'],note:'threshold crossed → scale out'}),
 st('Flapping','CASE','Thrashing at the threshold',
  ['Load hovers at 70%. The scaler adds a box, load drops to 65%, it removes one, load rises… forever.','Cooldown periods and hysteresis (add at 70, remove at 30) stop the oscillation.'],
  'Without cooldowns and hysteresis, control loops oscillate.',
  {flights:[fl('mon','s3','req',100,400,'add'),fl('mon','s3','req',900,400,'remove'),fl('mon','s3','req',1700,400,'add'),fl('mon','s3','req',2500,400,'remove')],metrics:{load:70},alert:['mon'],loop:true,note:'add/remove/add/remove…'}),
 st('Predict','CONCEPT','Scale before the spike',
  ['Reactive scaling lags: booting a box takes minutes. Scheduled scaling pre-warms for known patterns; predictive models learn them.','Keep reactive as the safety net underneath.'],
  'Predict for known rhythms, react for surprises.',
  {flights:[fl('mon','s2','req',100,500,'pre-warm'),fl('mon','s3','req',500,500,'pre-warm'),fl('users','lb','req',1300,500,'9 am spike'),fl('lb','s2','req',1900,500)],metrics:{load:55,fleet:3,cost:30},note:'scheduled scale-up at 08:45'}),
 st('Recap','RECAP','Scale down gently',
  ['Drain connections before terminating a box; never kill mid-request. Set min/max bounds so bugs can’t scale you to zero — or to bankruptcy.','Elasticity is a cost feature and a reliability feature at once.'],
  'Autoscale with cooldowns, bounds, and graceful drains — then stop paying for idle.',
  {metrics:{load:45,fleet:2,cost:20},flights:[fl('lb','mon','res',100,500,'cpu 22%'),fl('mon','s3','req',900,500,'drain + remove')],focus:['mon'],note:'2 boxes · $20/hr · same SLA'})
])]},
{num:'03',title:'Data & Storage',color:'#7b5fd6',lessons:[
L('sqlnosql','SQL vs NoSQL',8,'Beginner',' Choosing a data model by access pattern, not by hype.',
 ['Relational vs document modeling','Joins vs embedding','Schema flexibility trade-offs','A practical decision checklist'],
 [M('join','JOIN COST','clock'),M('flex','SCHEMA FLEX','bars','%'),M('tx','TXN SUPPORT','check','')],'sql',[
 st('The fork','PROBLEM','Orders, users, products — where do they live?',
  ['Your shop has entities with relationships. Do you model tables with foreign keys, or nested documents?','The right answer comes from how you read and write, not from which DB is trendy.'],
  'Choose the data model that matches your access patterns.',
  {add:['app','pg','doc'],focus:['app']}),
 st('SQL','CONCEPT','Tables + joins: one truth, many views',
  ['Normalize: each fact stored once. Query any combination with joins. Transactions keep multi-table updates consistent.','Cost: joins at read time, and migrations when shape changes.'],
  'SQL optimizes for correctness and query flexibility.',
  {flights:[fl('app','pg','req',200,700,'SELECT … JOIN'),fl('pg','app','res',1100,700,'orders ⋈ users')],metrics:{join:8,flex:40,tx:1},focus:['pg'],note:'one fact, one place'}),
 st('NoSQL','CONCEPT','Documents: read-shaped data',
  ['Embed the order’s items and address inside one document. One read fetches everything — no joins.','Cost: duplicated facts drift; cross-document transactions are weaker or absent.'],
  'Documents optimize for read locality and schema agility.',
  {flights:[fl('app','doc','req',200,600,'GET order/42'),fl('doc','app','res',900,600,'whole document')],metrics:{join:0,flex:90,tx:0},focus:['doc'],note:'one read, whole aggregate'}),
 st('Drift','CASE','The duplicated address problem',
  ['A user updates their address. In SQL: one row. In embedded documents: 200 past orders now disagree.','Denormalization is a promise to maintain every copy yourself.'],
  'Every embedded copy is a future consistency bug you must own.',
  {flights:[fl('app','doc','req',200,600,'update address ×200')],alert:['doc'],note:'200 documents to patch'}),
 st('Recap','RECAP','The checklist',
  ['Need multi-row transactions and ad-hoc queries? SQL. Massive scale on known key-based access? Consider a KV/document store.','And remember: Postgres does JSON too. The gap is narrower than the marketing.'],
  'Default to relational until a concrete access pattern demands otherwise.',
  {metrics:{join:8,flex:40,tx:1},flights:[fl('app','pg','req',100,600),fl('pg','app','res',900,600)],loop:true})
]),
L('indexes','Indexes Explained',8,'Beginner','The single highest-leverage performance tool in your database.',
 ['What a B-tree index actually is','Why scans get slow and seeks stay fast','Composite index ordering','The write cost of every index'],
 [M('scan','FULL SCAN','clock'),M('seek','INDEX SEEK','clock'),M('writes','WRITE COST','up','%')],'index',[
 st('Slow page','PROBLEM','The 400 ms query returns',
  ['<code>WHERE category = ’shoes’</code> scans all 2M rows to find 8k matches. The database reads everything to answer almost nothing.','This is the slow hop from lesson 1, now under the microscope.'],
  'Without an index, every query is a full table scan.',
  {add:['app','db'],flights:[fl('app','db','req',200,700,'WHERE category'),fl('db','app','res',1100,1800,'2M rows read')],metrics:{scan:400},alert:['db'],note:'2,000,000 rows → 8,000 matches'}),
 st('B-tree','CONCEPT','A sorted shortcut',
  ['An index is a sorted B-tree of (category → row pointers). Find ‘shoes’ in ~4 page hops, then fetch only matching rows.','Logarithmic lookup: doubling the table adds one hop, not double the work.'],
  'Indexes turn O(n) scans into O(log n) seeks.',
  {add:['idx'],flights:[fl('db','idx','req',200,450,'seek shoes'),fl('idx','db','res',750,450,'8k pointers'),fl('db','app','res',1400,600,'8k rows')],metrics:{scan:400,seek:5},focus:['idx'],note:'4 page hops vs 2M rows'}),
 st('Composite','CONCEPT','Order matters: leftmost prefix',
  ['Index on <code>(category, price)</code> serves “category = X” and “category = X AND price < Y” — but NOT “price < Y” alone.','Think phone book: sorted by last name, then first. You can’t search by first name alone.'],
  'Composite indexes serve prefixes of their column list, left to right.',
  {flights:[fl('app','db','req',100,500,'cat + price ✓'),fl('db','idx','req',700,400),fl('app','db','req',1500,500,'price only ✗'),fl('db','app','res',2100,1200,'scan…')],loop:true,note:'(category, price) ≠ (price)'}),
 st('Write cost','CASE','Indexes aren’t free',
  ['Every INSERT must update every index. Ten indexes = ten extra writes per row, plus storage and cache pressure.','Index the queries you actually run; drop the ones you don’t.'],
  'Indexes trade write speed and space for read speed.',
  {flights:[fl('app','db','req',200,600,'INSERT'),fl('db','idx','req',900,500,'update tree')],metrics:{writes:35},focus:['idx'],note:'each index = +1 write per row'}),
 st('Recap','RECAP','Read the query plan',
  ['<code>EXPLAIN</code> shows scan vs seek. Add indexes for hot filters and joins, watch write latency, and re-check after schema changes.','Most “we need a bigger database” moments are missing-index moments.'],
  'Before scaling hardware, read the plan. The fix is usually one CREATE INDEX.',
  {metrics:{scan:400,seek:5,writes:35},flights:[fl('app','db','req',100,500),fl('db','idx','req',700,400),fl('idx','db','res',1200,400),fl('db','app','res',1700,500)],loop:true})
]),
L('acid','Transactions & ACID',8,'Intermediate','How databases keep money correct when everything fails at once.',
 ['Atomicity via rollback','Isolation levels and anomalies','Durability via write-ahead logs','When to relax guarantees'],
 [M('atomic','ATOMICITY','check',''),M('iso','ISOLATION','lock',''),M('wal','WAL SYNC','clock')],'acid',[
 st('The transfer','PROBLEM','Debit without credit',
  ['Transfer $100: debit A, credit B. The server crashes between the two. Money vanished.','A transaction makes both writes succeed together or not at all.'],
  'Atomicity: partial work must never become visible.',
  {add:['app','db'],flights:[fl('app','db','req',200,600,'debit A ✓'),fl('app','db','req',1100,600,'credit B …crash')],alert:['db'],note:'crash between writes = lost money'}),
 st('WAL','CONCEPT','Write the promise first',
  ['Before touching data pages, the DB appends the change to a write-ahead log and fsyncs it. Crash? Replay the log.','Durability = the log survived, even if the data file didn’t catch up.'],
  'The WAL is the database’s source of truth; pages are a cache of it.',
  {add:['wal'],flights:[fl('db','wal','req',200,500,'log: debit+credit'),fl('wal','db','res',800,400,'fsync ✓'),fl('db','app','res',1400,500,'COMMIT ok')],metrics:{wal:3},focus:['wal'],note:'log first, data later'}),
 st('Isolation','CONCEPT','Concurrent transactions shouldn’t peek',
  ['Two transfers run at once. Without isolation, one reads the other’s half-done state (dirty read) or double-counts (lost update).','Isolation levels trade concurrency for correctness: read-committed → repeatable-read → serializable.'],
  'Isolation defines which concurrent anomalies are allowed.',
  {flights:[fl('app','db','req',100,500,'txn 1'),fl('app','db','req',500,500,'txn 2'),fl('db','app','res',1300,500,'serialized ✓')],metrics:{iso:1},loop:true,note:'serializable = as-if one at a time'}),
 st('Relax','CASE','Not everything needs SERIALIZABLE',
  ['A page-view counter can tolerate lost updates; a balance cannot. Use cheap isolation for analytics, strict for money.','Match the guarantee to the business cost of being wrong.'],
  'Strong guarantees cost throughput — pay for them where correctness pays you back.',
  {flights:[fl('app','db','req',100,400,'views++ (relaxed)'),fl('app','db','req',900,700,'balance (strict)')],loop:true,note:'counters: eventual · money: ACID'}),
 st('Recap','RECAP','A, C, I, D in one line each',
  ['Atomic: all or nothing. Consistent: constraints hold. Isolated: no peeking. Durable: commits survive crashes.','You get these from one database cheaply. Across services, you’ll rebuild them by hand — later lessons.'],
  'ACID is a contract. Know which clauses your feature actually needs.',
  {metrics:{atomic:1,iso:1,wal:3},flights:[fl('app','db','req',100,500),fl('db','wal','req',700,400),fl('wal','db','res',1200,400),fl('db','app','res',1700,500)],loop:true})
]),
L('replication','Replication',8,'Intermediate','Copies of your data for survival and read scale — and the lag they bring.',
 ['Primary/replica topology','Sync vs async replication','Replication lag and read-your-writes','Failover and split-brain'],
 [M('lag','REPLICA LAG','clock'),M('reads','READ SCALE','bars','×'),M('rpo','DATA LOSS','target','s')],'replica',[
 st('One copy','PROBLEM','The primary dies at 2 am',
  ['One database, one disk. When it dies, the shop is down until restore — hours. And backups are minutes stale.','Replication keeps live copies ready to serve.'],
  'A single copy of data is a single point of failure and a read ceiling.',
  {add:['app','pri'],flights:[fl('app','pri','req',200,600,'write')],alert:['pri'],note:'no copies = downtime + data loss'}),
 st('Ship the log','CONCEPT','Replicas replay the WAL',
  ['The primary streams its write-ahead log to replicas, which replay it. Same trick as durability, now across machines.','Async: commit fast, replicas trail by milliseconds. Sync: wait for a replica ack — safer, slower.'],
  'Replication is the WAL, shipped. Sync vs async is latency vs safety.',
  {add:['r1','r2'],flights:[fl('pri','r1','res',200,600,'WAL stream'),fl('pri','r2','res',400,600,'WAL stream')],metrics:{lag:40,rpo:0},focus:['r1','r2'],loop:true}),
 st('Read scale','CONCEPT','Send reads to replicas',
  ['Writes go to the primary; reads fan out to replicas. 3 copies ≈ 3× read capacity.','The primary’s job shrinks to writes — often 10% of traffic.'],
  'Read replicas multiply read capacity without touching write paths.',
  {flights:[fl('app','r1','req',100,500,'SELECT'),fl('r1','app','res',700,500,'rows'),fl('app','pri','req',1400,500,'INSERT')],metrics:{reads:3},loop:true}),
 st('Lag','CASE','“I just saved it — where is it?”',
  ['User edits profile (primary), reload reads a replica 200 ms behind — old data. Read-your-writes violated.','Fix: read your own writes from the primary, or wait for the replica to catch up to your commit LSN.'],
  'Async replication means stale reads are a feature, not a bug — design for it.',
  {flights:[fl('app','pri','req',100,500,'save name'),fl('app','r1','req',900,500,'read name'),fl('r1','app','res',1500,500,'old name ✗')],metrics:{lag:200},alert:['r1'],note:'replica 200 ms behind primary'}),
 st('Recap','RECAP','Failover without split-brain',
  ['Promote a replica when the primary dies — but fence the old primary first, or two writers diverge (split-brain).','Use a consensus-backed manager; never let two nodes believe they’re primary.'],
  'Replicas give survival and read scale; lag and failover are the price. Pay deliberately.',
  {metrics:{lag:40,reads:3,rpo:0},flights:[fl('app','pri','req',100,500),fl('pri','r1','res',700,500),fl('pri','r2','res',900,500)],loop:true})
]),
L('sharding','Sharding',9,'Intermediate','Splitting one dataset across machines when one box can’t hold it.',
 ['Range vs hash sharding','Choosing a shard key','Hot shards and resharding pain','Cross-shard queries and joins'],
 [M('size','PER SHARD','db','GB'),M('hot','HOTTEST SHARD','bolt','%'),M('xq','CROSS-SHARD','swap','%')],'shard',[
 st('Too big','PROBLEM','20 TB, one disk',
  ['The table outgrew the biggest box. Replicas copy everything — they don’t shrink anything.','Sharding partitions rows across machines: each holds a slice.'],
  'Replication copies data; sharding divides it. Different problems.',
  {add:['app','rt','a'],metrics:{size:20000},alert:['a'],note:'20 TB > any single box'}),
 st('Split','CONCEPT','Pick a key, pick a rule',
  ['Range: a–h, i–p, q–z. Simple, but sequential keys pile onto one shard. Hash: spread evenly, but range scans hit every shard.','The shard key is the most consequential choice you’ll make — changing it later means moving everything.'],
  'Shard key = your future hot spots and your future migrations.',
  {add:['b','c'],flights:[fl('rt','a','req',100,500,'user ann'),fl('rt','b','req',600,500,'user mo'),fl('rt','c','req',1100,500,'user zed')],metrics:{size:6600},focus:['rt'],loop:true}),
 st('Hot shard','CASE','Celebrity problem',
  ['Shard by user_id and one celebrity’s shard takes 40% of traffic. Even distribution of keys ≠ even distribution of load.','Fix: split hot keys further, cache them, or isolate them on dedicated shards.'],
  'Hashing spreads keys, not popularity. Measure load, not row counts.',
  {flights:[fl('rt','b','req',100,400),fl('rt','b','req',400,400),fl('rt','b','req',700,400),fl('rt','b','req',1000,400)],metrics:{hot:40},alert:['b'],loop:true,note:'one key ≠ one load unit'}),
 st('Cross-shard','CASE','Joins across the split',
  ['“Orders joined with users” now spans machines. No local join; the app fetches from both and stitches.','Design so common queries live inside one shard (co-locate by the same key). Accept fan-out for the rest.'],
  'Sharding trades local joins for horizontal capacity. Co-locate what you join.',
  {flights:[fl('app','rt','req',100,400),fl('rt','a','req',600,450),fl('rt','c','req',800,450),fl('a','app','res',1400,450),fl('c','app','res',1600,450,'stitch')],metrics:{xq:18},note:'fan-out + app-side join'}),
 st('Recap','RECAP','Shard last, shard well',
  ['Try indexes, caching, replicas, and bigger boxes first. When you must shard: choose a high-cardinality, query-aligned key and plan resharding from day one.','Sharding is a one-way door — walk through it with a map.'],
  'Sharding solves capacity by sacrificing locality. Exhaust cheaper options first.',
  {metrics:{size:6600,hot:12,xq:18},flights:[fl('app','rt','req',100,450),fl('rt','b','req',700,450),fl('b','app','res',1300,450)],loop:true})
]),
L('cache101','Caching 101',7,'Beginner','The fastest query is the one you never run.',
 ['Cache-aside pattern','Hit ratio and its leverage','TTLs and staleness budgets','What belongs in a cache'],
 [M('hit','HIT RATIO','target','%'),M('dbq','DB QPS','db',''),M('lat','READ LATENCY','clock')],'cache',[
 st('Same question','PROBLEM','The homepage hits the DB 900×/s',
  ['Every visitor runs the same “top products” query. The DB answers identically 900 times a second.','Compute once, remember the answer, serve memory copies.'],
  'Caching exploits repetition: most reads ask yesterday’s questions.',
  {add:['app','db'],flights:[fl('app','db','req',100,400),fl('db','app','res',600,400),fl('app','db','req',1100,400),fl('db','app','res',1600,400)],metrics:{dbq:900,lat:25},loop:true,alert:['db']}),
 st('Cache-aside','CONCEPT','Look aside, then fall through',
  ['App checks cache first. Hit → return in ~1 ms. Miss → query DB, store result with a TTL, return.','The app owns the pattern; the cache stays dumb and fast.'],
  'Cache-aside: read cache → on miss read DB → populate → return.',
  {add:['cache'],flights:[fl('app','cache','req',100,350,'top products?'),fl('cache','app','res',550,350,'HIT ✓'),fl('app','cache','req',1200,350,'new key?'),fl('app','db','req',1700,450,'miss → DB'),fl('db','app','res',2250,450),fl('app','cache','req',2850,350,'set TTL 60s')],metrics:{hit:92,dbq:72,lat:2},focus:['cache'],note:'92% hits → DB load ÷ 12'}),
 st('Leverage','CONCEPT','Hit ratio is leverage',
  ['At 90% hits, DB load drops 10×. At 99%, 100×. The last few percent are worth more than the first ninety.','Small hot sets make high ratios achievable — cache the 5% of keys serving 90% of reads.'],
  'Every point of hit ratio multiplies your database’s effective capacity.',
  {flights:[fl('app','cache','req',100,300),fl('cache','app','res',500,300),fl('app','cache','req',900,300),fl('cache','app','res',1300,300),fl('app','db','req',1900,500,'rare miss')],metrics:{hit:99,dbq:9,lat:1},loop:true}),
 st('Staleness','CASE','The price changed 30 s ago',
  ['TTL 60 s means prices can be a minute old. For a homepage: fine. For checkout: re-read from the DB.','Set TTLs by business tolerance, and bypass cache on correctness-critical paths.'],
  'A cache is a staleness budget. Spend it where being slightly wrong is cheap.',
  {flights:[fl('app','cache','req',100,350,'price?'),fl('cache','app','res',550,350,'old price'),fl('app','db','req',1200,500,'checkout: fresh')],note:'TTL = how wrong you may be'}),
 st('Recap','RECAP','Cache the reads, not the truth',
  ['The DB remains the source of truth; the cache is a disposable accelerator. If flushing it only slows you down — not breaks you — you’ve done it right.','Next: the hard part — keeping copies honest.'],
  'Cache-aside + TTL + high hit ratio = the cheapest 10× you’ll ever buy.',
  {metrics:{hit:99,dbq:9,lat:1},flights:[fl('app','cache','req',100,300),fl('cache','app','res',500,300)],loop:true})
]),
L('invalidate','Cache Invalidation',8,'Intermediate','“There are only two hard things…” — here’s the other one.',
 ['Why TTL-only fails for writes','Delete-on-write vs update-on-write','Race conditions and double-delete','Versioned keys as an escape hatch'],
 [M('stale','STALE READS','clock','s'),M('race','RACE WINDOW','target','ms'),M('hits','HIT RATIO','target','%')],'invalid',[
 st('The lie','PROBLEM','The cache confidently lies',
  ['Writer updates the DB. The cache still serves the old value for up to a TTL. Users see a price that no longer exists.','TTLs bound staleness; they don’t eliminate it on writes.'],
  'Every cache write policy is a decision about who may see stale data, for how long.',
  {add:['app','cache','db','wr'],flights:[fl('wr','db','req',200,500,'price = $9'),fl('app','cache','req',1000,350),fl('cache','app','res',1450,350,'$12 ✗')],metrics:{stale:60},alert:['cache'],note:'DB says $9 · cache says $12'}),
 st('Delete','CONCEPT','Invalidate on write',
  ['After committing to the DB, delete the cache key. Next read misses and refetches fresh data.','Delete, don’t update: computing the new cache value invites ordering bugs; deletion is idempotent.'],
  'Write DB → delete key. Let the next reader rebuild the truth.',
  {flights:[fl('wr','db','req',100,500,'commit $9'),fl('wr','cache','req',800,400,'DEL price'),fl('app','cache','req',1500,350,'miss'),fl('app','db','req',2000,450),fl('db','app','res',2550,450,'$9 ✓')],metrics:{stale:1},focus:['cache']}),
 st('Race','CASE','The interleaving that bites',
  ['Reader misses, reads old DB value… writer commits and deletes… reader then stores its old value. Stale until TTL.','Mitigations: short TTLs as backstop, delayed double-delete, or versioned keys.'],
  'Cache races are real: a slow reader can resurrect deleted data.',
  {flights:[fl('app','db','req',100,900,'read $12 (slow)'),fl('wr','db','req',400,400,'commit $9'),fl('wr','cache','req',900,300,'DEL'),fl('app','cache','req',1400,400,'SET $12 ✗')],metrics:{race:900,stale:60},alert:['cache'],note:'slow reader re-poisons cache'}),
 st('Version','CONCEPT','Versioned keys never lie',
  ['Store under <code>price:v42</code>; bump the version on write. Readers ask for the current version — old entries are simply never requested again.','No deletion races; garbage expires by TTL. Costs a version lookup.'],
  'Immutable, versioned keys turn invalidation into a pointer swap.',
  {flights:[fl('wr','db','req',100,400,'commit v43'),fl('app','cache','req',800,350,'price:v43'),fl('cache','app','res',1250,350,'fresh ✓')],metrics:{stale:0,race:0,hits:97},note:'bump version → old keys orphaned'}),
 st('Recap','RECAP','Pick your staleness contract',
  ['TTL-only for tolerant reads. Delete-on-write + short TTL for most apps. Versioned keys where races are unacceptable.','Write the contract down — “users may see X seconds stale” — and design to it.'],
  'Invalidation is a policy, not a trick. Choose it explicitly per dataset.',
  {metrics:{stale:1,race:0,hits:97},flights:[fl('wr','db','req',100,450),fl('wr','cache','req',700,350,'DEL'),fl('app','cache','req',1300,350),fl('app','db','req',1800,450)],loop:true})
]),
L('cdns','CDNs & Edge Caches',7,'Beginner','Putting copies of your content next to your users.',
 ['How edge PoPs absorb traffic','Cache keys and Vary headers','Purging and stale-while-revalidate','Dynamic acceleration at the edge'],
 [M('rtt','USER RTT','clock'),M('off','ORIGIN OFFLOAD','target','%'),M('purge','PURGE TIME','replay','s')],'cdn',[
 st('Distance','PROBLEM','Lisbon ↔ Virginia, 90 times a day',
  ['Every image, script, and stylesheet crosses the Atlantic. 150 ms RTT × dozens of assets = a sluggish shop.','The origin can’t move. The copies can.'],
  'You can’t beat the speed of light — but you can shorten the distance.',
  {add:['user','origin'],flights:[fl('user','origin','req',200,1300,'app.js'),fl('origin','user','res',1700,1300)],metrics:{rtt:150,off:0},note:'every asset crosses the ocean'}),
 st('Edge','CONCEPT','A cache in every city',
  ['CDN points of presence cache your static assets worldwide. Lisbon users hit a Lisbon edge: 10 ms instead of 150.','First request per edge fetches from origin; the next thousand are local.'],
  'CDNs are geographically distributed cache-aside, operated for you.',
  {add:['edge'],flights:[fl('user','edge','req',100,350,'app.js'),fl('edge','origin','req',600,900,'first miss'),fl('origin','edge','res',1600,900),fl('edge','user','res',2600,350,'cached ✓'),fl('user','edge','req',3200,300),fl('edge','user','res',3600,300,'10 ms')],metrics:{rtt:10,off:95},focus:['edge'],note:'1 miss, then thousands of local hits'}),
 st('Keys','CONCEPT','What makes a cache entry unique?',
  ['URL alone isn’t enough: language, device, encoding vary the bytes. <code>Vary</code> headers split entries — too many variants kill hit ratio.','Normalize keys; push personalization out of cacheable assets.'],
  'Cache key design decides hit ratio. Fewer variants, more hits.',
  {flights:[fl('user','edge','req',100,300,'/app.js · gzip'),fl('edge','user','res',500,300,'HIT'),fl('user','edge','req',1000,300,'/app.js · br'),fl('edge','origin','req',1400,800,'variant miss')],loop:true,note:'Vary: Accept-Encoding, Accept-Language'}),
 st('Purge','CASE','Shipping a fix, worldwide',
  ['Bad JS deployed. Purge the URL across all PoPs — seconds, not a TTL wait. Better: hashed filenames (<code>app.9f3.js</code>) make purges unnecessary.','<code>stale-while-revalidate</code> serves the old copy instantly while refreshing in background.'],
  'Content-hash your assets; reserve purges for emergencies.',
  {flights:[fl('edge','origin','req',100,700,'revalidate'),fl('origin','edge','res',900,700,'app.9f3.js')],metrics:{purge:3},note:'immutable URLs + short HTML TTL'}),
 st('Recap','RECAP','The edge is your first cache layer',
  ['CDN → app cache → DB cache: each layer absorbs repetition closer to the user. 95% offload means the origin serves 1/20th of the traffic.','Latency drops for users AND load drops for you — the rare double win.'],
  'Push bytes to the edge; keep the origin for truth and personalization.',
  {metrics:{rtt:10,off:95,purge:3},flights:[fl('user','edge','req',100,300),fl('edge','user','res',500,300)],loop:true})
]),
L('blobs','Object Storage & Blobs',6,'Beginner','Where images, videos, and backups actually live.',
 ['Why files don’t belong in the DB or on app disks','Buckets, keys, and presigned URLs','Serving blobs through CDNs','Durability nines and lifecycle tiers'],
 [M('size','AVG OBJECT','image','MB'),M('dur','DURABILITY','shield','9s'),M('cost','COST / GB','chart','$')],'blob',[
 st('Wrong home','PROBLEM','User avatars in the database',
  ['Storing images as rows bloats backups, kills cache efficiency, and pins bytes to app disks that autoscaling destroys.','Files need a store built for files.'],
  'Databases are for structured truth; blobs are for bytes.',
  {add:['app'],alert:['app'],note:'BLOBs in rows = slow everything'}),
 st('Buckets','CONCEPT','An infinite key→bytes map',
  ['Object storage: PUT <code>avatars/u42.jpg</code> into a bucket; GET it back. No filesystem, no size limit, 11 nines of durability via internal replication.','Cheap, elastic, and boring — exactly what you want for bytes.'],
  'Object storage trades filesystem semantics for unlimited scale and durability.',
  {add:['store'],flights:[fl('app','store','req',200,700,'PUT avatar.jpg'),fl('store','app','res',1100,500,'201 ✓')],metrics:{size:2,dur:11,cost:0.02},focus:['store']}),
 st('Presign','CONCEPT','Let clients upload directly',
  ['Your API issues a presigned URL; the browser uploads straight to the bucket. Bytes never transit your servers.','Same for downloads of private files. Your app handles permissions, not payloads.'],
  'Presigned URLs keep bulk bytes off your app tier entirely.',
  {flights:[fl('app','store','req',100,500,'sign URL'),fl('store','app','res',700,500,'PUT url ✓')],note:'client → bucket, directly'}),
 st('Serve','CONCEPT','CDN in front, always',
  ['Public assets: bucket behind a CDN. Edge caches absorb viral traffic; origin egress stays tiny.','Lifecycle rules move cold objects to cheaper tiers automatically.'],
  'Blob store + CDN = cheap storage, fast global reads.',
  {add:['cdn'],flights:[fl('cdn','store','req',200,600,'fetch once'),fl('store','cdn','res',900,600),fl('cdn','store','req',1700,300,'cached after')],metrics:{cost:0.01},focus:['cdn'],loop:true}),
 st('Recap','RECAP','The storage triad',
  ['Structured data → database. Hot small values → cache. Big immutable bytes → object store + CDN.','Each tool does one job well; forcing one to do all three is how systems get slow and expensive.'],
  'Right store, right data. Blobs in buckets, truth in tables, speed in caches.',
  {metrics:{size:2,dur:11,cost:0.01},flights:[fl('app','store','req',100,600),fl('store','cdn','res',900,500)],loop:true})
]),
L('consistency','Consistency Models',9,'Advanced','What “the data” means when there are many copies of it.',
 ['Strong vs eventual consistency','Read-your-writes and monotonic reads','Quorums: W + R > N','Session guarantees as a middle path'],
 [M('w','WRITE QUORUM','up',''),M('r','READ QUORUM','download',''),M('stale','STALE WINDOW','clock')],'consist',[
 st('Two answers','PROBLEM','Which node is right?',
  ['You write “name = Ada” to node A. A friend reads node B and sees the old name. Both nodes are “the database”.','Consistency models define what reads are allowed to return after writes.'],
  'With replicas, “correct read” is a policy choice, not a given.',
  {add:['cl','a','b'],flights:[fl('cl','a','req',200,500,'name=Ada'),fl('cl','b','req',1100,500,'read name'),fl('b','cl','res',1700,500,'old name')],alert:['b'],note:'A and B disagree, temporarily'}),
 st('Strong','CONCEPT','Linearizability: one copy illusion',
  ['Every read sees the latest write, everywhere. Achieved by coordinating nodes on every operation — paying latency each time.','Great for balances and locks; expensive for everything else.'],
  'Strong consistency = the system behaves like a single copy, at single-copy speed costs.',
  {flights:[fl('cl','a','req',100,500,'write'),fl('a','b','req',700,600,'sync ack'),fl('b','a','res',1400,600),fl('cl','b','req',2200,500,'read'),fl('b','cl','res',2800,500,'Ada ✓')],metrics:{stale:0},note:'coordinate before acknowledging'}),
 st('Quorum','CONCEPT','W + R > N overlaps truth',
  ['N=3 copies. Write to W=2, read from R=2. Any read set intersects any write set — at least one node has the latest value.','Tune W and R for latency vs safety without full coordination.'],
  'Quorums buy overlap-based correctness without syncing everyone.',
  {flights:[fl('cl','a','req',100,450,'write 1/2'),fl('cl','b','req',300,450,'write 2/2'),fl('cl','b','req',1100,450,'read 1/2'),fl('cl','a','req',1300,450,'read 2/2')],metrics:{w:2,r:2,stale:0},loop:true,note:'N=3 · W=2 · R=2 → overlap guaranteed'}),
 st('Session','CASE','Eventually consistent, personally consistent',
  ['Global staleness of seconds is fine for a feed — but users must see their own posts instantly. Session guarantees: read-your-writes + monotonic reads.','Route a user’s reads to a replica that has their writes (sticky LSN). Eventual for the world, strong for you.'],
  'Session guarantees give each user a coherent story without global coordination.',
  {flights:[fl('cl','a','req',100,450,'my post'),fl('cl','a','req',900,450,'my read → A ✓'),fl('cl','b','req',1700,450,'other read → B (ok)')],metrics:{stale:2},loop:true,note:'your writes follow you'}),
 st('Recap','RECAP','Name your model',
  ['Strong: one-copy illusion, high cost. Eventual: cheap, stale windows. Session: per-user coherence.','Write the model into the design doc. “It’s consistent” is not a specification.'],
  'Consistency is a dial between latency and truth. Set it per feature, explicitly.',
  {metrics:{w:2,r:2,stale:2},flights:[fl('cl','a','req',100,450),fl('a','b','res',700,550),fl('cl','b','req',1500,450)],loop:true})
]),
L('cap','CAP in Practice',9,'Advanced','The theorem everyone quotes and few apply correctly.',
 ['What C, A, P actually mean','Why partitions are inevitable','CP vs AP during a real outage','PACELC: the latency trade too'],
 [M('part','PARTITION','target',''),M('avail','AVAILABILITY','check','%'),M('lat','NORMAL LATENCY','clock')],'cap',[
 st('The split','PROBLEM','The link between regions dies',
  ['EU and US regions can’t talk. A user writes in EU; another reads in US. You must choose: refuse one, or diverge.','That’s CAP: under Partition, pick Consistency or Availability.'],
  'CAP only bites during partitions — but partitions always happen eventually.',
  {add:['cl','eu','us'],flights:[fl('cl','eu','req',200,500,'write'),fl('cl','us','req',1100,500,'read?')],alert:['eu','us'],metrics:{part:1},note:'EU ✕ US — link severed'}),
 st('CP','CONCEPT','Choose truth, refuse some requests',
  ['The minority side rejects writes (and maybe reads) until healed. No divergence, but errors for some users.','Banks, locks, inventory counts: correctness beats uptime.'],
  'CP systems return errors rather than wrong answers.',
  {flights:[fl('cl','us','req',200,500,'write'),fl('us','cl','res',900,500,'503 ✗ refuse')],metrics:{avail:66},note:'minority side: unavailable'}),
 st('AP','CONCEPT','Choose uptime, reconcile later',
  ['Both sides accept writes; they diverge and merge when healed (last-write-wins, CRDTs, or manual).','Carts, likes, feeds: a merged approximation beats an error page.'],
  'AP systems stay writable and pay with reconciliation complexity.',
  {flights:[fl('cl','eu','req',100,450,'write ✓'),fl('cl','us','req',600,450,'write ✓'),fl('eu','us','res',1600,900,'merge on heal')],metrics:{avail:100},loop:true,note:'diverge now, merge later'}),
 st('PACELC','CONCEPT','Even without partitions, choose',
  ['Else (no partition): Latency vs Consistency. Sync replication is consistent and slow; async is fast and eventually consistent.','CAP is the outage choice; PACELC adds the everyday choice.'],
  'PACELC: partition → C or A; else → L or C. You choose twice.',
  {flights:[fl('eu','us','res',100,500,'sync (slow, C)'),fl('eu','us','res',1200,250,'async (fast, L)')],metrics:{part:0,lat:40},loop:true,note:'no outage ≠ no trade-off'}),
 st('Recap','RECAP','Classify your data, not your DB',
  ['Balance ledger → CP. Shopping cart → AP. Most systems are both, per dataset.','And no, “CA” isn’t an option: networks partition whether you plan for it or not.'],
  'CAP is a per-dataset decision made under partition. Make it before the outage makes it for you.',
  {metrics:{part:0,avail:100,lat:40},flights:[fl('cl','eu','req',100,450),fl('eu','us','res',700,500),fl('cl','us','req',1400,450)],loop:true})
])]},
{num:'04',title:'Communication',color:'#e2762f',lessons:[
L('rest','REST vs RPC',7,'Beginner','Two styles of talking between services — and when each shines.',
 ['Resource-oriented vs action-oriented APIs','Idempotency of HTTP verbs','Why internal calls often prefer RPC','Contracts, versioning, and evolution'],
 [M('calls','CALLS / PAGE','swap',''),M('bytes','PAYLOAD','download','KB'),M('lat','CALL LATENCY','clock')],'rest',[
 st('The boundary','PROBLEM','The frontend needs the backend',
  ['Two programs, one network. How do they agree on what a call means? Two dominant styles: REST and RPC.','The choice shapes caching, evolution, and tooling for years.'],
  'API style is a contract about meaning, not just transport.',
  {add:['cl','rest','rpc'],focus:['cl']}),
 st('REST','CONCEPT','Nouns over the wire',
  ['<code>GET /orders/42</code>, <code>POST /orders</code>. Resources + standard verbs. GETs are cacheable and safe; PUT/DELETE are idempotent.','The uniform interface lets browsers, proxies, and CDNs participate for free.'],
  'REST leverages HTTP semantics: caching, safety, idempotency — built in.',
  {flights:[fl('cl','rest','req',200,600,'GET /orders/42'),fl('rest','cl','res',1000,600,'200 · JSON')],metrics:{calls:6,bytes:4,lat:35},focus:['rest'],note:'GET = safe + cacheable'}),
 st('RPC','CONCEPT','Verbs over the wire',
  ['<code>Orders.Get(42)</code> — call a function on another machine. gRPC adds typed contracts (protobuf) and HTTP/2 streams.','Tight, fast, explicit. Perfect for internal service-to-service chatter.'],
  'RPC optimizes for developer ergonomics and payload efficiency inside your walls.',
  {flights:[fl('cl','rpc','req',200,450,'Orders.Get(42)'),fl('rpc','cl','res',800,450,'proto reply')],metrics:{calls:6,bytes:1,lat:18},focus:['rpc'],note:'binary + typed + multiplexed'}),
 st('Chatty','CASE','The N+1 API',
  ['REST page needs 6 round trips: order, user, items, prices… A single RPC <code>GetOrderPage</code> returns it all in one.','Public API: REST for compatibility. Internal aggregation: one tailored call.'],
  'Match granularity to the caller: coarse calls for pages, fine calls for resources.',
  {flights:[fl('cl','rest','req',100,400),fl('cl','rest','req',600,400),fl('cl','rest','req',1100,400),fl('cl','rpc','req',1900,450,'GetOrderPage'),fl('rpc','cl','res',2450,450,'all-in-one')],metrics:{calls:1,lat:20},note:'6 trips → 1 trip'}),
 st('Recap','RECAP','Both, on purpose',
  ['Edge: REST/HTTP+JSON for reach and caching. Core: RPC for speed and contracts. Version both; never break callers silently.','The style is a tool — pick per boundary, not per ideology.'],
  'REST at the edge, RPC in the core. Contracts everywhere.',
  {metrics:{calls:1,bytes:1,lat:20},flights:[fl('cl','rest','req',100,500),fl('rest','cl','res',700,500),fl('cl','rpc','req',1400,400),fl('rpc','cl','res',1900,400)],loop:true})
]),
L('queues','Message Queues',8,'Intermediate','Decoupling “do it now” from “do it eventually”.',
 ['Why synchronous chains fail','At-least-once delivery and idempotent consumers','Competing consumers and scaling','Dead-letter queues and poison messages'],
 [M('sync','SYNC CHAIN','clock'),M('backlog','BACKLOG','queue',''),M('workers','WORKERS','gear','')],'queue',[
 st('The chain','PROBLEM','Checkout waits for everything',
  ['Order → charge → email → analytics → shipping label, all in one request. Email provider hiccups; checkout times out.','The user’s critical path should include only what must happen now.'],
  'Every synchronous dependency borrows its failures into your latency.',
  {add:['prod'],flights:[fl('prod','prod','req',200,600,'wait… wait…')],metrics:{sync:2400},alert:['prod'],note:'checkout = sum of 5 services'}),
 st('Enqueue','CONCEPT','Acknowledge now, work later',
  ['Checkout writes the order and drops a message on a queue: 50 ms, done. Workers handle email, analytics, labels asynchronously.','The queue is a buffer that absorbs spikes and outages.'],
  'Queues turn “call and wait” into “record and proceed”.',
  {add:['q','w1'],flights:[fl('prod','q','req',200,450,'order.paid'),fl('q','w1','req',900,500,'deliver'),fl('w1','q','res',1600,400,'ack ✓')],metrics:{sync:50,backlog:0},focus:['q']}),
 st('Compete','CONCEPT','Add workers, drain faster',
  ['Backlog grows during a spike? Add competing consumers; each message goes to exactly one worker. Throughput scales linearly.','The queue smooths the burst; workers catch up when traffic subsides.'],
  'Competing consumers convert a backlog into a throughput dial.',
  {add:['w2','w3'],flights:[fl('q','w1','req',100,450),fl('q','w2','req',400,450),fl('q','w3','req',700,450),fl('q','w1','req',1200,450),fl('q','w2','req',1500,450)],metrics:{backlog:1200,workers:3},loop:true}),
 st('Poison','CASE','The message that always fails',
  ['One malformed message crashes its worker, redelivers, crashes again — forever. After N failures, move it to a dead-letter queue for inspection.','At-least-once delivery means consumers must be idempotent: processing twice must equal once.'],
  'Design for redelivery: idempotent handlers + DLQ for poison.',
  {flights:[fl('q','w2','req',100,400,'bad msg'),fl('w2','q','res',600,400,'nack'),fl('q','w2','req',1100,400,'retry'),fl('q','w2','res',1600,400,'nack → DLQ')],alert:['w2'],loop:true,note:'3 strikes → dead-letter queue'}),
 st('Recap','RECAP','Async is a superpower with rules',
  ['Queue the non-critical work, scale consumers, make handlers idempotent, and watch backlog + DLQ as your vital signs.','Users get fast acks; failures get contained; spikes get absorbed.'],
  'Queues decouple time: accept now, process when able, never lose the work.',
  {metrics:{sync:50,backlog:0,workers:3},flights:[fl('prod','q','req',100,400),fl('q','w3','req',700,450),fl('w3','q','res',1300,350,'ack')],loop:true})
]),
L('pubsub','Pub/Sub & Events',7,'Intermediate','One fact, many interested listeners — without coupling them.',
 ['Queues vs topics','Fan-out to independent subscribers','Event schemas as contracts','Replay and event history'],
 [M('subs','SUBSCRIBERS','branch',''),M('fanout','FAN-OUT','swap','×'),M('couple','COUPLING','target','%')],'pubsub',[
 st('Growing list','PROBLEM','Every new feature edits checkout',
  ['Email, then analytics, then shipping, then loyalty points — each integration adds a call inside the orders service.','The producer knows everyone. That’s coupling, and it compounds.'],
  'Point-to-point calls make the producer own every consumer’s existence.',
  {add:['pub'],alert:['pub'],metrics:{couple:90},note:'orders svc knows 4 teams'}),
 st('Topic','CONCEPT','Publish facts, not commands',
  ['Orders publishes <code>order.paid</code> to a topic once. Subscribers each get their own copy, independently.','The producer announces what happened; it doesn’t care who listens.'],
  'Events state facts. Consumers decide consequences.',
  {add:['topic','s1','s2','s3'],flights:[fl('pub','topic','req',200,450,'order.paid'),fl('topic','s1','res',800,450),fl('topic','s2','res',950,450),fl('topic','s3','res',1100,450)],metrics:{subs:3,fanout:3,couple:10},focus:['topic']}),
 st('Independence','CASE','Analytics falls over',
  ['The analytics consumer crashes for an hour. Email and shipping keep flowing; analytics replays its offset when it returns.','Each subscription has its own cursor — one slow consumer can’t block the others.'],
  'Per-subscriber cursors isolate failures and enable replay.',
  {flights:[fl('topic','s1','res',100,400),fl('topic','s3','res',300,400),fl('topic','s2','res',1500,700,'replay backlog')],alert:['s2'],loop:true,note:'s2 down ≠ pipeline down'}),
 st('Schemas','CONCEPT','The event is a public API',
  ['Consumers parse your payload. Rename a field and three teams break. Version schemas, add fields don’t remove, use a registry.','Treat events with the same discipline as REST endpoints.'],
  'Event schemas are contracts — evolve them additively.',
  {flights:[fl('pub','topic','req',100,400,'v2 payload'),fl('topic','s1','res',700,400,'parse ✓'),fl('topic','s2','res',900,400,'parse ✓')],loop:true,note:'{id, total, currency, …} — additive only'}),
 st('Recap','RECAP','Queue vs topic',
  ['Queue: one message, one worker (distribute work). Topic: one event, every subscriber (broadcast facts).','Use queues for tasks, topics for facts. Most systems need both.'],
  'Pub/sub inverts dependency: producers publish truth, consumers opt in.',
  {metrics:{subs:3,fanout:3,couple:10},flights:[fl('pub','topic','req',100,400),fl('topic','s1','res',650,400),fl('topic','s2','res',800,400),fl('topic','s3','res',950,400)],loop:true})
]),
L('realtime','WebSockets & Realtime',8,'Intermediate','When polling isn’t enough: persistent, bidirectional connections.',
 ['Polling vs long-poll vs WebSocket','Connection state at the edge','Fan-out across gateway nodes','Presence and heartbeats'],
 [M('poll','POLL WASTE','replay','%'),M('conn','LIVE CONNS','swap','k'),M('push','PUSH LATENCY','bolt')],'realtime',[
 st('Polling','PROBLEM','“Any new messages?” × a million',
  ['Chat clients poll every 2 s. 99% of responses are “nothing new”. A million users = 500k useless req/s.','Realtime needs the server to speak first.'],
  'Polling spends capacity asking questions whose answer is usually “no”.',
  {add:['a','ws'],flights:[fl('a','ws','req',100,350,'new?'),fl('ws','a','res',550,350,'nope'),fl('a','ws','req',1000,350,'new?'),fl('ws','a','res',1450,350,'nope')],metrics:{poll:99},loop:true,alert:['ws']}),
 st('Upgrade','CONCEPT','One socket, both directions',
  ['WebSocket upgrades HTTP into a persistent duplex channel. Either side sends anytime; pushes arrive in milliseconds.','The gateway holds the connection; your app publishes to it.'],
  'WebSockets invert the conversation: servers push, clients listen.',
  {add:['b'],flights:[fl('a','ws','hs',100,500,'upgrade'),fl('ws','a','hs',700,500,'101 ✓'),fl('b','ws','hs',1300,500,'upgrade'),fl('ws','b','hs',1900,500,'101 ✓')],metrics:{poll:0,conn:2,push:25},focus:['ws'],note:'persistent · duplex · ~0 overhead'}),
 st('Fan-out','CONCEPT','Routing between gateways',
  ['Ana is on gateway 1, Ben on gateway 2. A message must cross gateways — via pub/sub or a shared bus.','Connections are sticky state at the edge; the bus routes events to whoever holds the socket.'],
  'Realtime at scale = stateful edges + a routing backbone.',
  {flights:[fl('a','ws','req',100,400,'“hi Ben”'),fl('ws','b','res',700,400,'push ✓')],metrics:{push:25},loop:true}),
 st('Presence','CASE','Offline, online, typing…',
  ['Heartbeats detect dead sockets (mobile networks lie). Presence service tracks online state; typing indicators are ephemeral events — never stored.','Persist messages; keep presence in memory with TTLs.'],
  'Not all realtime data deserves durability. Separate messages from signals.',
  {add:['store','pres'],flights:[fl('ws','store','req',100,450,'persist msg'),fl('ws','pres','req',600,350,'Ana: online'),fl('ws','b','res',1100,350,'typing…')],focus:['pres'],loop:true,note:'messages → disk · presence → TTL memory'}),
 st('Recap','RECAP','Push when “now” matters',
  ['Chat, cursors, live dashboards: WebSockets. Everything else: request/response is simpler and scales easier.','Hold state at the edge, route via bus, persist only what must survive.'],
  'Realtime is a state-management problem wearing a networking costume.',
  {metrics:{poll:0,conn:2,push:25},flights:[fl('a','ws','req',100,350),fl('ws','b','res',600,350),fl('b','ws','req',1200,350),fl('ws','a','res',1700,350)],loop:true})
])]},
{num:'05',title:'Reliability',color:'#2f7fd6',lessons:[
L('retries','Timeouts & Retries',7,'Intermediate','The two settings that decide whether failures stay small.',
 ['Why every call needs a deadline','Retry budgets and exponential backoff','Jitter against thundering herds','Retry storms and amplification'],
 [M('timeout','TIMEOUT','clock'),M('tries','ATTEMPTS','replay',''),M('load','RETRY LOAD','bars','%')],'retry',[
 st('Hanging','PROBLEM','The call that never returns',
  ['A dependency stalls. Without a timeout, your threads pile up waiting, and your service dies of someone else’s problem.','Deadlines convert infinite waits into fast, handleable errors.'],
  'No timeout = unbounded resource consumption on someone else’s failure.',
  {add:['cl','svc'],flights:[fl('cl','svc','req',200,2500,'waiting…')],alert:['cl'],metrics:{timeout:0},note:'threads pile up while waiting'}),
 st('Deadline','CONCEPT','Budget your latency',
  ['Set timeouts from your latency budget: page must load in 300 ms → dependency gets 100 ms, not 30 s.','Fail fast, fall back (cache, default, degrade) instead of hanging.'],
  'Timeouts are latency budgets enforced at every hop.',
  {flights:[fl('cl','svc','req',100,800),fl('svc','cl','res',1500,600,'late!')],metrics:{timeout:100},note:'cut at 100 ms · fall back'}),
 st('Backoff','CONCEPT','Retry politely',
  ['Transient blip? Retry — but wait 100 ms, then 200, then 400, with random jitter. Cap attempts (e.g., 3).','Jitter prevents synchronized clients from hammering in lockstep.'],
  'Exponential backoff + jitter + attempt cap = retries that heal instead of harm.',
  {flights:[fl('cl','svc','req',100,400,'try 1 ✗'),fl('cl','svc','req',900,400,'try 2 ✗'),fl('cl','svc','req',2100,400,'try 3 ✓'),fl('svc','cl','res',2600,400)],metrics:{tries:3},note:'100 → 200 → 400 ms (+jitter)'}),
 st('Storm','CASE','Retries multiply load',
  ['3 layers each retry 3× = 27× load on the failing service. Your retries become the outage.','Retry only at one layer, use retry budgets (e.g., ≤10% extra traffic), and never retry non-idempotent writes blindly.'],
  'Retries amplify: without budgets, they turn blips into avalanches.',
  {flights:[fl('cl','svc','req',100,250),fl('cl','svc','req',250,250),fl('cl','svc','req',400,250),fl('cl','svc','req',550,250),fl('cl','svc','req',700,250),fl('cl','svc','req',850,250)],metrics:{load:2700},alert:['svc'],loop:true,note:'3 layers × 3 retries = 27×'}),
 st('Recap','RECAP','The reliability starter pack',
  ['Timeout every call. Retry transient errors with backoff+jitter, once, within budget. Make writes idempotent so retries are safe.','These three habits prevent most cascading failures.'],
  'Deadlines contain failures; disciplined retries heal them.',
  {metrics:{timeout:100,tries:3,load:110},flights:[fl('cl','svc','req',100,400),fl('svc','cl','res',700,400)],loop:true})
]),
L('breaker','Circuit Breakers',7,'Intermediate','Stop calling a service that’s already down.',
 ['The three states: closed, open, half-open','Failing fast to protect yourself','Fallbacks and graceful degradation','Breakers vs retries'],
 [M('state','STATE','shield',''),M('fail','FAIL RATE','target','%'),M('waste','WASTED CALLS','replay','')],'breaker',[
 st('Piling on','PROBLEM','Kicking a service while it’s down',
  ['Payments is failing 100%. Every checkout still waits the full timeout, then retries. Your threads burn on a corpse.','You need a memory of failure: stop calling what’s broken.'],
  'Without a breaker, every caller independently rediscover the same outage.',
  {add:['cl','br','svc'],flights:[fl('cl','br','req',100,350),fl('br','svc','req',550,900,'timeout ✗'),fl('cl','br','req',1700,350),fl('br','svc','req',2150,900,'timeout ✗')],metrics:{fail:100,waste:100},alert:['svc'],loop:true}),
 st('Open','CONCEPT','Trip the breaker',
  ['After N failures, the breaker opens: calls fail instantly with a fallback (“try again shortly”, queued payment). No threads wasted.','Your service stays healthy while the dependency heals.'],
  'Open breaker = fail fast locally instead of slowly remotely.',
  {flights:[fl('cl','br','req',100,300),fl('br','cl','res',500,300,'fallback ✓')],metrics:{state:1,waste:0},focus:['br'],note:'OPEN · instant fallback'}),
 st('Half-open','CONCEPT','Probe for recovery',
  ['After a cooldown, let one trial call through (half-open). Success → close the breaker. Failure → open again.','Recovery is tested with a trickle, not a flood.'],
  'Half-open probes recover traffic gradually and safely.',
  {flights:[fl('cl','br','req',100,300),fl('br','svc','req',500,500,'probe'),fl('svc','br','res',1100,500,'200 ✓'),fl('br','cl','res',1700,300,'CLOSED')],metrics:{state:0,fail:5},focus:['br'],note:'probe ok → closed → normal'}),
 st('Fallback','CASE','What does the user see?',
  ['Breakers need answers for the open state: cached data, defaults, queued work, or honest “temporarily unavailable”.','Design fallbacks per feature — a breaker without one just fails faster.'],
  'A breaker is only as good as its fallback path.',
  {flights:[fl('cl','br','req',100,300),fl('br','cl','res',500,300,'cached prices')],metrics:{state:1},loop:true,note:'serve stale · queue writes · degrade UI'}),
 st('Recap','RECAP','Retries heal, breakers contain',
  ['Retries handle blips; breakers handle outages. Together: try briefly, then stop, then probe.','Wrap every remote dependency. Your future 3 am self says thanks.'],
  'Fail fast, fall back, probe gently. Outages stay contained.',
  {metrics:{state:0,fail:2,waste:0},flights:[fl('cl','br','req',100,300),fl('br','svc','req',500,400),fl('svc','br','res',1000,400),fl('br','cl','res',1500,300)],loop:true})
]),
L('failover','Health Checks & Failover',7,'Intermediate','Detecting death and routing around it, automatically.',
 ['Liveness vs readiness probes','Graceful draining on deploy','Failover targets: RTO and RPO','Avoiding cascading overload'],
 [M('detect','DETECT TIME','clock','s'),M('rto','RTO','replay','s'),M('healthy','HEALTHY','check','/2')],'failover',[
 st('Dead box','PROBLEM','50% of requests fail',
  ['App B is dead but still in rotation. The LB keeps sending it half the traffic. Users see every other request fail.','Detection must be automatic and fast.'],
  'Undetected failure is worse than failure: it’s failure plus confusion.',
  {add:['users','lb','a','b'],flights:[fl('lb','a','req',100,400),fl('a','lb','res',600,400,'200'),fl('lb','b','req',1100,400),fl('b','lb','res',1600,900,'✗ timeout')],metrics:{healthy:1,detect:0},alert:['b'],loop:true}),
 st('Probes','CONCEPT','Ask constantly, eject quickly',
  ['Readiness: “can you serve?” — gates LB membership. Liveness: “are you stuck?” — triggers restart. Three misses → eject.','Detection in seconds, not support tickets.'],
  'Readiness controls traffic; liveness controls restarts. Don’t confuse them.',
  {flights:[fl('lb','b','hs',100,300,'probe ✗'),fl('lb','b','hs',500,300,'probe ✗'),fl('lb','b','hs',900,300,'probe ✗ → eject'),fl('lb','a','req',1500,400),fl('a','lb','res',2000,400)],metrics:{detect:9,healthy:1},focus:['lb'],note:'3 strikes in 9 s → ejected'}),
 st('Drain','CONCEPT','Deploy without dropping',
  ['On deploy: mark unready → LB stops new requests → finish in-flight ones → terminate. Zero dropped requests.','Failover machinery doubles as deploy machinery.'],
  'Draining = failover you schedule instead of suffer.',
  {flights:[fl('lb','a','req',100,400,'last requests'),fl('a','lb','res',600,400,'done ✓')],note:'unready → drain → replace'}),
 st('Cascade','CASE','The survivor overload',
  ['Two boxes at 70% each. One dies; the survivor gets 140% and dies too. Failover completed… into total outage.','Keep N+1 headroom, or shed load during failover. Redundancy without headroom is theater.'],
  'Survivors must absorb the dead’s load — capacity-plan for N−1.',
  {flights:[fl('lb','a','req',100,250),fl('lb','a','req',350,250),fl('lb','a','req',600,250),fl('lb','a','req',850,250)],metrics:{healthy:0},alert:['a'],loop:true,note:'140% load → cascade'}),
 st('Recap','RECAP','RTO and RPO',
  ['RTO: how long until service returns. RPO: how much data you may lose. Probes + replicas + headroom are how you hit your targets.','Write the numbers down; test the failover quarterly.'],
  'Detect fast, route around, keep headroom. Failover is a system, not a switch.',
  {metrics:{detect:9,rto:12,healthy:2},flights:[fl('users','lb','req',100,400),fl('lb','a','req',600,400),fl('a','lb','res',1100,400)],loop:true})
]),
L('pressure','Backpressure & Rate Limits',8,'Intermediate','Saying “no” so the system can keep saying “yes”.',
 ['Why unbounded queues kill systems','Load shedding by priority','Token buckets and leaky buckets','429s, Retry-After, and client behavior'],
 [M('in','INCOMING','bars','rps'),M('cap','CAPACITY','gear','rps'),M('shed','SHED','funnel','%')],'pressure',[
 st('Flood','PROBLEM','1000 rps into a 300 rps service',
  ['A viral moment 3×’s traffic. Queues grow, latency climbs, everything times out — including the 300 rps you could have served.','Overload doesn’t just slow you; it destroys useful work.'],
  'Past capacity, accepting everything means serving nothing well.',
  {add:['prod','api'],flights:[fl('prod','api','req',100,250),fl('prod','api','req',300,250),fl('prod','api','req',500,250),fl('prod','api','req',700,250),fl('prod','api','req',900,250)],metrics:{in:1000,cap:300},alert:['api'],loop:true,note:'queue grows → all requests time out'}),
 st('Shed','CONCEPT','Reject early, cheaply',
  ['A limiter at the edge admits 300 rps and rejects the rest with <code>429 + Retry-After</code>. The admitted 300 stay fast.','Shed low-priority work first: recommendations before checkout.'],
  'Load shedding protects the work you accept by refusing the rest.',
  {add:['lim'],flights:[fl('prod','lim','req',100,300),fl('lim','api','req',500,350,'admitted'),fl('prod','lim','req',1000,300),fl('lim','prod','res',1400,300,'429')],metrics:{shed:70},focus:['lim'],note:'300 fast · 700 politely refused'}),
 st('Bucket','CONCEPT','Token bucket: burst-friendly',
  ['Tokens refill at r per second, bucket holds b. Requests spend a token; empty → reject. Allows bursts up to b, averages r.','Leaky bucket instead smooths to a constant outflow — pick by whether bursts are welcome.'],
  'Token bucket = average rate + burst allowance, in one tiny algorithm.',
  {flights:[fl('prod','lim','req',100,250),fl('prod','lim','req',250,250),fl('prod','lim','req',400,250),fl('lim','api','req',700,350,'burst ok'),fl('prod','lim','req',1400,250),fl('lim','prod','res',1750,250,'429')],loop:true,note:'refill 300/s · bucket 600'}),
 st('Backpressure','CASE','Push back upstream',
  ['Workers signal “slow down”: bounded queues block producers, reactive streams request(n), TCP windows shrink.','End-to-end backpressure makes the whole pipeline self-regulating instead of self-destructing.'],
  'Backpressure propagates capacity limits upstream before buffers explode.',
  {flights:[fl('api','lim','res',100,400,'queue 90%'),fl('lim','prod','res',700,400,'slow down')],metrics:{in:320,shed:68},note:'bounded buffers + signals'}),
 st('Recap','RECAP','No is a feature',
  ['Cap intake, shed by priority, return honest 429s, and propagate pressure upstream.','A system that degrades predictably beats one that collapses impressively.'],
  'Protect capacity by refusing excess. Graceful “no” > catastrophic “yes”.',
  {metrics:{in:320,cap:300,shed:6},flights:[fl('prod','lim','req',100,300),fl('lim','api','req',500,350),fl('api','lim','res',1000,350)],loop:true})
])]},
{num:'06',title:'Architecture',color:'#159f8c',lessons:[
L('monolith','Monolith to Services',8,'Intermediate','When to split, what to split, and what it costs.',
 ['Why monoliths are a great default','Seams: splitting along business boundaries','The distributed tax: network, data, ops','The modular monolith middle path'],
 [M('deploy','DEPLOY TIME','up','min'),M('blast','BLAST RADIUS','target','%'),M('calls','REMOTE CALLS','swap','')],'monolith',[
 st('Growing pains','PROBLEM','One codebase, forty engineers',
  ['Every deploy ships everyone’s changes. One team’s memory leak kills all features. Build times hit 40 minutes.','The monolith’s coupling is now organizational, not just technical.'],
  'Split when team coordination costs exceed distribution costs.',
  {add:['cl','mono'],flights:[fl('cl','mono','req',200,600,'everything')],metrics:{deploy:40,blast:100},alert:['mono'],note:'one leak → whole shop down'}),
 st('Seams','CONCEPT','Cut along business lines',
  ['Extract orders, users, billing — each owns its data and API. High cohesion inside, narrow contracts between.','Never split by technical layer (a “database service” is a distributed monolith).'],
  'Service boundaries = business capabilities with owned data.',
  {add:['o','u','b'],flights:[fl('mono','o','req',100,500,'extract'),fl('mono','u','req',600,500),fl('mono','b','req',1100,500)],metrics:{blast:33},focus:['o','u','b']}),
 st('The tax','CASE','A function call becomes a network call',
  ['In-process: 100 ns, never fails. Remote: 2 ms, can time out, needs retries, auth, versioning, tracing.','Every seam you cut adds this tax forever. Cut fewer seams than you think.'],
  'Distribution converts certainty into probability. Budget for it.',
  {flights:[fl('o','u','req',100,500,'GetUser'),fl('u','o','res',800,500),fl('o','b','req',1500,500,'Charge'),fl('b','o','res',2200,500,'timeout?')],metrics:{calls:14},alert:['b'],note:'now: retries, auth, tracing, versions'}),
 st('Modular','CONCEPT','The middle path',
  ['A modular monolith: strict internal boundaries, one deploy. Most benefits of services, none of the network tax.','Extract a service only when it needs independent scaling, deployment, or ownership.'],
  'Modular monolith first; services where independence pays for itself.',
  {flights:[fl('cl','mono','req',100,500),fl('mono','cl','res',800,500)],metrics:{deploy:8,blast:100,calls:0},focus:['mono'],note:'boundaries in code, not network'}),
 st('Recap','RECAP','Architecture follows organization',
  ['Small team → monolith. Many teams → services along team boundaries. Always → owned data per capability.','The goal is independent progress, not microservice count.'],
  'Split for autonomy, not fashion. Every boundary is a permanent tax.',
  {metrics:{deploy:8,blast:33,calls:14},flights:[fl('cl','mono','req',100,450),fl('mono','o','req',700,450),fl('o','cl','res',1300,450)],loop:true})
]),
L('gateway','API Gateways',7,'Intermediate','One front door for many services.',
 ['Cross-cutting concerns at the edge','Auth, rate limits, routing in one place','Gateway vs service mesh','Avoiding the gateway bottleneck'],
 [M('auth','AUTH CHECKS','lock',''),M('routes','ROUTES','branch',''),M('lat','EDGE OVERHEAD','clock')],'gateway',[
 st('Everywhere','PROBLEM','Auth copied into five services',
  ['Each service re-implements tokens, rate limits, CORS, logging. Five copies drift; one forgets to check expiry.','Cross-cutting concerns belong at a shared edge.'],
  'Duplicated edge logic is duplicated security risk.',
  {add:['cl','a','b','c'],flights:[fl('cl','a','req',100,400),fl('cl','b','req',600,400),fl('cl','c','req',1100,400)],alert:['c'],note:'5 services × 5 concerns = 25 copies'}),
 st('Front door','CONCEPT','The gateway owns the edge',
  ['Clients hit one endpoint. The gateway verifies auth, enforces limits, routes <code>/orders</code> → orders svc, aggregates responses.','Services trust the gateway and focus on business logic.'],
  'Gateway = the single place where policy meets traffic.',
  {add:['gw'],flights:[fl('cl','gw','req',100,400,'Bearer …'),fl('gw','a','req',700,400,'/orders ✓'),fl('a','gw','res',1200,400),fl('gw','cl','res',1700,400)],metrics:{auth:1,routes:3,lat:4},focus:['gw']}),
 st('Aggregate','CONCEPT','One call, three services',
  ['The mobile homepage needs orders + users + search. The gateway fans out and composes one response — saving two round trips over mobile networks.','Keep aggregation thin; heavy composition belongs in a dedicated BFF.'],
  'Edge aggregation trades gateway work for client round trips.',
  {flights:[fl('cl','gw','req',100,400,'GET /home'),fl('gw','a','req',600,400),fl('gw','b','req',750,400),fl('gw','c','req',900,400),fl('gw','cl','res',1700,450,'composed')],note:'1 client call → 3 internal'}),
 st('Mesh','CASE','East-west traffic too?',
  ['Gateway handles north-south (client→service). Service-to-service (east-west) needs mTLS, retries, tracing — that’s a service mesh’s job.','Don’t route internal chatter through the edge gateway; it becomes a bottleneck and SPOF.'],
  'Gateway for the edge; mesh for the interior. Different traffic, different tool.',
  {flights:[fl('a','b','req',100,400,'internal mTLS'),fl('b','a','res',700,400)],metrics:{lat:4},note:'north-south ≠ east-west'}),
 st('Recap','RECAP','Keep the door thin',
  ['Auth, limits, routing, coarse aggregation — yes. Business logic — no. Run gateways redundantly and keep them stateless.','A fat gateway becomes the monolith you tried to escape.'],
  'Centralize policy, not logic. The edge should be boring and fast.',
  {metrics:{auth:1,routes:3,lat:4},flights:[fl('cl','gw','req',100,350),fl('gw','b','req',600,350),fl('b','gw','res',1100,350),fl('gw','cl','res',1500,350)],loop:true})
]),
L('eventdriven','Event-Driven Systems',8,'Advanced','Choreography instead of orchestration.',
 ['Events as the integration backbone','Choreography vs orchestration','Eventual consistency workflows','The outbox pattern for reliable publishing'],
 [M('steps','WORKFLOW STEPS','branch',''),M('couple','COUPLING','target','%'),M('lag','END-TO-END','clock')],'events',[
 st('The saga','PROBLEM','An order spans four services',
  ['Order → reserve stock → charge → ship. Orchestrated synchronously, any hiccup fails the whole chain and leaves partial state.','You need a workflow that survives partial failure.'],
  'Multi-service workflows need a failure story for every step.',
  {add:['ord'],alert:['ord'],note:'4 services, 1 transaction? impossible'}),
 st('Choreograph','CONCEPT','Each service reacts and emits',
  ['Orders emits <code>order.created</code>. Inventory reserves and emits <code>stock.reserved</code>. Payments charges and emits <code>payment.captured</code>…','No conductor — each service knows its cue and its line.'],
  'Choreography: services react to facts and publish new facts.',
  {add:['bus','inv','pay','shp'],flights:[fl('ord','bus','req',100,400,'order.created'),fl('bus','inv','res',600,400),fl('inv','bus','req',1200,400,'stock.reserved'),fl('bus','pay','res',1700,400),fl('pay','bus','req',2300,400,'payment.captured'),fl('bus','shp','res',2800,400)],metrics:{steps:4,couple:10,lag:3200},focus:['bus']}),
 st('Compensate','CASE','Payment fails after stock reserved',
  ['You can’t roll back other services’ databases. Instead, emit <code>payment.failed</code> → inventory releases stock. A compensating action, not a rollback.','Sagas trade atomicity for a sequence of undoable steps.'],
  'Distributed “rollback” = forward compensating transactions.',
  {flights:[fl('pay','bus','req',100,400,'payment.failed'),fl('bus','inv','res',700,400),fl('inv','bus','req',1300,400,'stock.released')],alert:['pay'],note:'compensate, don’t rollback'}),
 st('Outbox','CONCEPT','Write DB and event atomically',
  ['Crash between DB commit and publish = lost event. Fix: write the event into an outbox table in the same transaction; a relay publishes it.','One atomic write, at-least-once delivery, no dual-write bug.'],
  'The outbox pattern makes “save + publish” atomic without distributed transactions.',
  {flights:[fl('ord','bus','req',100,400,'via outbox ✓')],metrics:{couple:10},note:'DB txn: row + outbox → relay → bus'}),
 st('Recap','RECAP','When to orchestrate instead',
  ['Choreography shines for loose, evolving flows. Complex branching workflows with timeouts deserve an explicit orchestrator (state machine).','Either way: idempotent handlers, outbox publishing, compensations.'],
  'Event-driven = eventual workflows. Design the failure paths first.',
  {metrics:{steps:4,couple:10,lag:3200},flights:[fl('ord','bus','req',100,350),fl('bus','inv','res',550,350),fl('bus','pay','res',700,350),fl('bus','shp','res',850,350)],loop:true})
]),
L('idempotency','Designing for Idempotency',7,'Intermediate','Making “do it twice” safe — the foundation of reliable retries.',
 ['Why networks force duplicates','Idempotency keys for writes','Natural vs synthetic idempotency','Exactly-once is a lie (and what to do instead)'],
 [M('dupes','DUPLICATE RATE','replay','%'),M('keys','KEY LOOKUPS','lock',''),M('safe','SAFE RETRIES','check','%')],'idem',[
 st('The double charge','PROBLEM','Client retries a timed-out payment',
  ['The charge succeeded but the response was lost. Client retries. Customer charged twice.','Timeouts are ambiguous: you can’t know if the write landed.'],
  'On a network, “no response” ≠ “no effect”. Retries create duplicates.',
  {add:['cl','api'],flights:[fl('cl','api','req',100,500,'charge $50'),fl('cl','api','req',1200,500,'retry $50'),fl('api','cl','res',1900,500,'charged ×2 ✗')],metrics:{dupes:4,safe:0},alert:['api'],note:'lost ack → duplicate charge'}),
 st('Keys','CONCEPT','Name the intent, dedupe the effect',
  ['Client sends <code>Idempotency-Key: abc123</code>. Server stores key → result atomically with the charge. Same key again? Return the stored result.','The retry becomes a read.'],
  'Idempotency keys turn ambiguous retries into safe lookups.',
  {add:['db'],flights:[fl('cl','api','req',100,450,'charge · key abc'),fl('api','db','req',700,400,'store key+result'),fl('cl','api','req',1500,450,'retry · key abc'),fl('api','db','req',2100,350,'lookup'),fl('db','api','res',2550,350,'same result'),fl('api','cl','res',3000,400,'charged ×1 ✓')],metrics:{dupes:0,keys:1,safe:100},focus:['db']}),
 st('Natural','CONCEPT','Some operations are born idempotent',
  ['<code>SET status=’paid’</code> is naturally idempotent; <code>balance += 50</code> is not. Prefer absolute writes over deltas where possible.','PUT and DELETE are idempotent by HTTP contract; POST is not — hence keys.'],
  'Design state changes as “set to X”, not “add X”, when you can.',
  {flights:[fl('cl','api','req',100,400,'PUT status=paid'),fl('cl','api','req',800,400,'PUT status=paid'),fl('api','cl','res',1400,400,'same state ✓')],metrics:{safe:100},loop:true,note:'absolute > relative writes'}),
 st('Exactly-once','CASE','The marketing term',
  ['“Exactly-once delivery” is impossible over networks. What exists: at-least-once delivery + idempotent processing = exactly-once effect.','Kafka’s “exactly-once” is this trick inside its own boundaries.'],
  'Aim for exactly-once effects, not exactly-once delivery.',
  {flights:[fl('cl','api','req',100,400,'msg'),fl('cl','api','req',600,400,'msg (dup)'),fl('api','db','req',1200,350,'dedupe'),fl('api','cl','res',1700,400,'effect ×1')],loop:true,note:'deliver ≥1 · process =1'}),
 st('Recap','RECAP','Make every write retryable',
  ['Keys for payments and orders, natural idempotency for state, dedupe tables for consumers. Then retries, queues, and failover all become safe.','Idempotency is the precondition for every reliability pattern you’ve learned.'],
  'If retrying it could hurt, it isn’t finished being designed.',
  {metrics:{dupes:0,keys:1,safe:100},flights:[fl('cl','api','req',100,400,'key abc'),fl('api','db','req',600,350),fl('db','api','res',1100,350),fl('api','cl','res',1500,400)],loop:true})
])]},
{num:'07',title:'Security',color:'#e0447c',lessons:[
L('tls','TLS Everywhere',7,'Beginner','Encrypting the conversation you learned to trace in lesson 1.',
 ['What TLS protects: confidentiality, integrity, identity','The handshake and certificate chain','TLS 1.3’s faster setup','Termination points and internal mTLS'],
 [M('hs','HANDSHAKE','swap','RTT'),M('enc','ENCRYPTED','lock','%'),M('verify','CERT CHECK','shield','')],'tls',[
 st('Plaintext','PROBLEM','Anyone on the path can read',
  ['Plain HTTP crosses dozens of routers. Any hop can read passwords, inject ads, or impersonate the shop.','The request conversation from lesson 1 is public by default.'],
  'Without TLS, the network is an untrusted room full of strangers.',
  {add:['cl','srv'],flights:[fl('cl','srv','req',200,800,'password=hunter2')],alert:['cl'],metrics:{enc:0},note:'every hop can read this'}),
 st('Handshake','CONCEPT','Prove identity, agree on keys',
  ['Server presents a certificate signed by a trusted CA. Client verifies the chain, then both derive session keys. TLS 1.3 does it in 1 RTT.','Now eavesdroppers see ciphertext; tampering is detected.'],
  'TLS = authenticated key exchange, then encrypted transport.',
  {add:['ca'],flights:[fl('cl','srv','hs',100,600,'ClientHello'),fl('srv','cl','hs',800,600,'cert + key share'),fl('cl','ca','hs',1500,500,'verify chain'),fl('ca','cl','hs',2100,500,'trusted ✓'),fl('cl','srv','req',2800,600,'🔒 encrypted')],metrics:{hs:1,enc:100,verify:1},focus:['ca'],note:'TLS 1.3: 1-RTT setup'}),
 st('Terminate','CONCEPT','Where does encryption end?',
  ['TLS usually terminates at the LB/gateway; internal hops were plaintext. Zero-trust says: encrypt inside too (mTLS).','Know your termination points — each is a place bytes are readable.'],
  'Encryption is only as strong as its weakest plaintext hop.',
  {flights:[fl('cl','srv','req',100,600,'🔒 public'),fl('srv','cl','res',900,600,'🔒')],metrics:{enc:100},note:'edge TLS · internal mTLS'}),
 st('mTLS','CASE','Services authenticate each other',
  ['In a mesh, both sides present certs: orders svc proves it’s orders, not an intruder with network access.','Identity per workload, rotated automatically — not one shared secret.'],
  'mTLS gives every service a cryptographic identity.',
  {flights:[fl('cl','srv','hs',100,500,'client cert'),fl('srv','cl','hs',700,500,'server cert'),fl('cl','srv','req',1400,500,'mutual ✓')],metrics:{verify:2},loop:true}),
 st('Recap','RECAP','TLS is table stakes',
  ['HTTPS everywhere, HSTS, modern ciphers, certs auto-renewed, internal mTLS where trust is zero.','It protects the conversation; auth (next lesson) protects the resources.'],
  'Encrypt the wire, verify the identity, then talk.',
  {metrics:{hs:1,enc:100,verify:2},flights:[fl('cl','srv','hs',100,450),fl('srv','cl','hs',650,450),fl('cl','srv','req',1300,500,'🔒')],loop:true})
]),
L('auth','AuthN vs AuthZ',7,'Beginner','Who you are vs what you may do — two different systems.',
 ['Authentication: sessions, tokens, OIDC','Authorization: roles, policies, ownership','Where checks must live','Common broken-access-control bugs'],
 [M('authn','AUTHN','user',''),M('authz','AUTHZ CHECKS','lock',''),M('bug','BAC BUGS','target','')],'auth',[
 st('Two questions','PROBLEM','Logged in ≠ allowed',
  ['User 42 authenticates fine. Then requests <code>/orders/43</code> — someone else’s order. Identity passed; permission was never checked.','AuthN answers “who?”; AuthZ answers “may they?”.'],
  'Authentication without authorization is an open door with a name tag.',
  {add:['u','idp','api'],flights:[fl('u','idp','req',100,500,'login ✓'),fl('u','api','req',900,500,'GET /orders/43'),fl('api','u','res',1600,500,'200 ✗ leak!')],metrics:{authn:1,authz:0,bug:1},alert:['api']}),
 st('AuthN','CONCEPT','Prove identity once',
  ['Password + MFA or OIDC provider → session cookie or short-lived JWT. The identity provider owns credentials; your app trusts its assertion.','Don’t build your own crypto or password flows — delegate.'],
  'Centralize identity; verify assertions at the edge.',
  {flights:[fl('u','idp','req',100,500,'OIDC'),fl('idp','u','res',800,500,'id_token ✓')],metrics:{authn:1},focus:['idp'],note:'delegate to an IdP'}),
 st('AuthZ','CONCEPT','Check ownership on every request',
  ['<code>order.owner == user.id</code>? Role allowed? Policy engines (RBAC/ABAC) centralize rules; handlers enforce them per object.','The #1 web vulnerability is missing object-level checks — not fancy crypto breaks.'],
  'Authorize every object access, server-side, every time.',
  {add:['data'],flights:[fl('u','api','req',100,450,'GET /orders/43'),fl('api','data','req',700,400,'owner?'),fl('data','api','res',1200,400,'owner=41'),fl('api','u','res',1700,450,'403 ✓')],metrics:{authz:1,bug:0},focus:['api'],note:'object-level check → 403'}),
 st('IDOR','CASE','The incremented ID',
  ['Attacker loops <code>/orders/1…99999</code>. Without ownership checks, they download everyone’s data (IDOR).','UUIDs hide IDs but don’t authorize. Only checks do.'],
  'Obscurity is not authorization. Check, don’t hide.',
  {flights:[fl('u','api','req',100,300,'/orders/1'),fl('u','api','req',450,300,'/orders/2'),fl('u','api','req',800,300,'/orders/3'),fl('api','u','res',1300,350,'403 · 403 · 403')],metrics:{authz:3,bug:0},loop:true}),
 st('Recap','RECAP','Two gates, both mandatory',
  ['AuthN at the edge via a trusted IdP; AuthZ per object in every handler, default-deny.','Test authorization like a feature — because attackers will.'],

  load(){try{return JSON.parse(localStorage.getItem('dts.v1'))||{}}catch(e){return{}}},

};

const learn=saved.learn||{};
